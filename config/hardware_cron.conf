# Hardware Management Cron Configuration
# =======================================
#
# This file documents the recommended cron schedules for
# autonomous hardware management and self-improvement.
#
# To install, run: crontab -e
# Then add the entries below (adjust paths as needed)
#
# IMPORTANT: Ensure DO_TOKEN environment variable is set
# for infrastructure provisioning capabilities.

# Environment variables (add these to crontab header)
# DO_TOKEN=your_digitalocean_token
# TELEGRAM_BOT_TOKEN=your_telegram_token
# TELEGRAM_CHAT_ID=your_chat_id

# ============================================
# HARDWARE MANAGEMENT SCHEDULES
# ============================================

# 1. Full hardware management cycle - every 15 minutes
#    Includes: health checks, scaling evaluation, acquisition triggers
*/15 * * * * /usr/bin/python3 /home/user/hands-off-engine/scripts/hardware_management_cron.py >> /var/log/hardware-management.log 2>&1

# 2. Self-healing agent - every 5 minutes
#    Quick checks for common issues (git locks, permissions, connectivity)
*/5 * * * * /usr/bin/python3 /home/user/hands-off-engine/scripts/self_healing_agent.py --once >> /var/log/self-healing.log 2>&1

# 3. Infrastructure scaler - hourly
#    Full infrastructure evaluation and scaling
0 * * * * /usr/bin/python3 /home/user/hands-off-engine/scripts/infrastructure_scaler.py >> /var/log/infrastructure-scaler.log 2>&1

# 4. Mirror sync (if running on Termux) - every 10 minutes
*/10 * * * * /bin/bash /home/user/hands-off-engine/termux-hands-off/agent/mirror_sync.sh >> /var/log/mirror-sync.log 2>&1

# 5. Mirror health check - every 30 minutes
*/30 * * * * /bin/bash /home/user/hands-off-engine/termux-hands-off/agent/mirror_health.sh >> /var/log/mirror-health.log 2>&1

# ============================================
# TIMEOUT CONFIGURATIONS (Reference)
# ============================================
#
# SSH connections: 30 second connect timeout
#   - ServerAliveInterval: 15 seconds
#   - ServerAliveCountMax: 3 attempts
#   - Total max wait: ~75 seconds before giving up
#
# API calls: 60 second timeout with 4 retries
#   - Exponential backoff: 2, 4, 8, 16 seconds
#   - Total max wait: ~5 minutes for critical operations
#
# Subprocess commands: 120 second timeout
#   - For operations like git, gh CLI

