# Dependabot configuration for Hands-Off Engine
# Automatically creates PRs for dependency updates
# Works with auto-merge workflow (dependabot[bot] is trusted)

version: 2
updates:
  # Python dependencies
  - package-ecosystem: "pip"
    directory: "/ai"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
      - "auto-merge"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    reviewers:
      - "yaya1738"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "auto-merge"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "yaya1738"
