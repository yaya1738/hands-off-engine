name: P0 Financial Integrity

on:
  push:
    branches:
      - fix/p0-financial-integrity-20261122
  pull_request:
    branches:
      - fix/hardware-cleanup-approval-20261115

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install pytest requests python-dotenv

      - name: Compile modified Python packages
        run: python -m compileall -q autonomous executor finance hardware scripts ui audit

      - name: Validate shell setup syntax
        run: bash -n scripts/setup_autonomous_mode.sh

      - name: Scan current source tree for embedded credentials
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --no-git --source /path --redact --report-format json --report-path /path/gitleaks-report.json --exit-code 1 || true
          python - <<'PY'
          import json
          import sys
          from pathlib import Path
          report = Path("gitleaks-report.json")
          findings = json.loads(report.read_text()) if report.exists() else []
          print(f"Credential scan findings: {len(findings)}")
          for item in findings:
              print(f"{item.get('File')}:{item.get('StartLine')} rule={item.get('RuleID')}")
          sys.exit(1 if findings else 0)
          PY

      - name: Run financial integrity regressions
        run: >-
          python -m pytest
          tests/test_p0_financial_integrity_guards.py
          tests/unit/test_executor_shadow_mode.py
          -q --tb=short
