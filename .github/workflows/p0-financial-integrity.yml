name: P0 Financial Integrity

on:
  push:
    branches:
      - fix/p0-financial-integrity-20261122
      - fix/financial-integrity-concurrency-20261122
  pull_request:
    branches:
      - fix/hardware-cleanup-approval-20261115
      - fix/p0-financial-integrity-20261122

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install pytest requests python-dotenv

      - name: Compile modified Python packages
        run: python -m compileall -q ai_nexus autonomous executor finance hardware scripts ui audit

      - name: Validate shell setup syntax
        run: bash -n scripts/setup_autonomous_mode.sh

      - name: Scan current source tree and Git history for embedded credentials
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --no-git --source /path --redact --report-format json --report-path /path/gitleaks-working-tree.json --exit-code 1 || true
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source /path --redact --report-format json --report-path /path/gitleaks-history.json --exit-code 1 || true
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          def findings(path):
              report = Path(path)
              return json.loads(report.read_text()) if report.exists() else []

          working = findings("gitleaks-working-tree.json")
          history = findings("gitleaks-history.json")
          print(f"Working-tree credential findings: {len(working)}")
          print(f"Git-history credential findings: {len(history)}")
          for source, items in (("working-tree", working), ("git-history", history)):
              for item in items:
                  print(f"{source}: {item.get('File')}:{item.get('StartLine')} rule={item.get('RuleID')}")
          sys.exit(1 if working or history else 0)
          PY
      - name: Run financial integrity regressions
        run: >-
          python -m pytest
          tests/test_p0_financial_integrity_guards.py
          tests/unit/test_executor_shadow_mode.py
          -q --tb=short
