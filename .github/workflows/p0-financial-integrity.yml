name: P0 Financial Integrity

on:
  push:
    branches:
      - fix/p0-financial-integrity-20261122
      - fix/financial-integrity-concurrency-20261122
  pull_request:
    branches:
      - fix/hardware-cleanup-approval-20261115
      - fix/p0-financial-integrity-20261122

permissions:
  contents: read

jobs:
  financial-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: python -m pip install pytest requests python-dotenv

      - name: Compile modified Python packages
        run: python -m compileall -q ai_nexus autonomous executor finance hardware scripts security ui audit termux-hands-off/agents

      - name: Validate shell setup syntax
        run: |
          bash -n scripts/setup_autonomous_mode.sh
          bash -n termux-hands-off/agents/security_mirror.sh

      - name: Scan current source tree and Git history for embedded credentials
        run: |
          set +e
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --no-git --source /path --redact --report-format json --report-path /path/gitleaks-working-tree.json --exit-code 1
          working_status=$?
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --source /path --redact --report-format json --report-path /path/gitleaks-history.json --exit-code 1
          history_status=$?
          set -e
          WORKING_STATUS="$working_status" HISTORY_STATUS="$history_status" python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          def findings(path):
              report = Path(path)
              if not report.is_file():
                  raise SystemExit(f"Credential scanner did not produce {path}")
              try:
                  data = json.loads(report.read_text())
              except (OSError, ValueError) as exc:
                  raise SystemExit(f"Credential scanner report is unreadable: {path}: {exc}")
              if not isinstance(data, list):
                  raise SystemExit(f"Credential scanner report has an invalid shape: {path}")
              return data

          working = findings("gitleaks-working-tree.json")
          history = findings("gitleaks-history.json")
          working_status = int(os.environ["WORKING_STATUS"])
          history_status = int(os.environ["HISTORY_STATUS"])
          print(f"Working-tree credential findings: {len(working)}")
          print(f"Git-history credential findings: {len(history)}")
          for source, items, status in (
              ("working-tree", working, working_status),
              ("git-history", history, history_status),
          ):
              if status not in (0, 1) or (status == 1 and not items):
                  print(f"{source}: scanner failed (exit {status})")
                  sys.exit(2)
              for item in items:
                  print(f"{source}: {item.get('File')}:{item.get('StartLine')} rule={item.get('RuleID')}")
          sys.exit(1 if working or history else 0)
          PY
      - name: Run financial integrity regressions
        run: >-
          python -m pytest
          tests/test_p0_financial_integrity_guards.py
          tests/unit/test_executor_shadow_mode.py
          tests/test_payment_monitor.py
          tests/test_legacy_execution_boundaries.py
          tests/test_legacy_finance_watcher_truth.py
          tests/test_migrate_private_state.py
          tests/test_private_identity_profile.py
          tests/test_private_state_resolver.py
          tests/test_private_finance_agents.py
          tests/test_finance_private_state.py
          -q --tb=short
