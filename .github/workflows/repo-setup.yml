name: Repository Auto-Configuration

# Automatically configure GitHub repository settings
# Runs weekly to ensure configuration doesn't drift
# Can be manually triggered for initial setup

on:
  workflow_dispatch:  # Manual trigger for initial setup
    inputs:
      skip_branch_protection:
        description: 'Skip branch protection configuration'
        type: boolean
        default: false
      skip_environments:
        description: 'Skip environments configuration'
        type: boolean
        default: false
      skip_security:
        description: 'Skip security features configuration'
        type: boolean
        default: false
      skip_project:
        description: 'Skip project board configuration'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC
  repository_dispatch:
    types: [telegram_trigger_setup]  # Requires TELEGRAM_SETUP_TOKEN authentication.

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    
    steps:
      - name: Authenticate Telegram setup caller
        if: github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_SETUP_TOKEN: ${{ secrets.TELEGRAM_SETUP_TOKEN }}
          PROVIDED_TOKEN: ${{ github.event.client_payload.webhook_token }}
        run: |
          if [ -z "$TELEGRAM_SETUP_TOKEN" ]; then
            echo "::error::TELEGRAM_SETUP_TOKEN repository secret is not configured"
            exit 1
          fi
          if [ -z "$PROVIDED_TOKEN" ]; then
            echo "::error::Missing Telegram setup authentication token"
            exit 1
          fi
          TELEGRAM_SETUP_TOKEN="$TELEGRAM_SETUP_TOKEN" PROVIDED_TOKEN="$PROVIDED_TOKEN" python - <<'PY'
          import hmac
          import os
          if not hmac.compare_digest(os.environ["TELEGRAM_SETUP_TOKEN"], os.environ["PROVIDED_TOKEN"]):
              print("::error::Invalid Telegram setup authentication")
              raise SystemExit(1)
          PY
          echo "Telegram setup caller authenticated"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Configure Branch Protection
        if: ${{ !inputs.skip_branch_protection }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Branch Protection Configuration"
          python scripts/github_setup/configure_branch_protection.py || {
            echo "::warning::Branch protection configuration failed - may require admin token"
            echo "Create a PAT with admin:repo scope and add as ADMIN_TOKEN secret if needed"
          }
          echo "::endgroup::"
      
      - name: Configure Environments
        if: ${{ !inputs.skip_environments }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Environments Configuration"
          python scripts/github_setup/configure_environments.py || {
            echo "::warning::Environments configuration failed - may require admin token"
          }
          echo "::endgroup::"
      
      - name: Configure Security Features
        if: ${{ !inputs.skip_security }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Security Configuration"
          python scripts/github_setup/configure_security.py || {
            echo "::warning::Some security features may require paid plan or admin access"
          }
          echo "::endgroup::"
      
      - name: Configure Project Board
        if: ${{ !inputs.skip_project }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Project Board Configuration"
          python scripts/github_setup/configure_project.py || {
            echo "::warning::Project board configuration requires manual setup"
          }
          echo "::endgroup::"
      
      - name: Check Configuration Status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Configuration Status"
          python scripts/github_setup/check_setup_status.py || {
            echo "::warning::Status check failed"
          }
          echo "::endgroup::"
      
      - name: Upload Configuration Logs
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: github-setup-logs
          path: logs/github_setup.jsonl
          if-no-files-found: ignore
          retention-days: 30
      
      - name: Log Setup Complete
        run: |
          echo "✅ Repository auto-configuration complete"
          echo "Note: Some operations may require elevated permissions (ADMIN_TOKEN)"
          echo "Self-hosted runner setup must be run on the droplet separately"
          echo ""
          echo "To manually configure remaining items:"
          echo "  1. Create ADMIN_TOKEN secret with admin:repo scope if needed"
          echo "  2. Run: gh workflow run repo-setup.yml"
          echo "  3. For runner setup, run: gh workflow run deploy-runner.yml --field droplet_ip=<IP>"
