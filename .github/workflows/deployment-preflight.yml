name: Deployment Preflight

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  pull_request:
    branches: [main]
  schedule:
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Repository deployment preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Run deterministic safety preflight
        run: python tools/factory_forensics/deployment_preflight.py .

      - name: Compile production Python modules
        run: |
          set -euo pipefail
          python -m compileall -q ai autonomous executor integrafix tools

      - name: Run safety-focused tests
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_live_order_authority.py tests/test_provisioning_gateway.py
