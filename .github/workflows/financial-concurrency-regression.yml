name: Financial Concurrency Regression

on:
  push:
    branches:
      - fix/financial-integrity-concurrency-20261122
  pull_request:
    branches:
      - fix/p0-financial-integrity-20261122

permissions:
  contents: read

jobs:
  financial-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest requests python-dotenv
      - name: Compile changed Python modules
        run: python -m py_compile audit/ledger.py scripts/payment_monitor.py tests/test_financial_integrity_concurrency.py
      - name: Run focused regressions
        run: python -m pytest tests/test_financial_integrity_concurrency.py -q --tb=short
