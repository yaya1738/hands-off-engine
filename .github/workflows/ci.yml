name: CI Tests

# Run on all PRs and pushes to main
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.event_name == 'push'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install test dependencies
          pip install pytest pytest-cov
          # Install linting tools
          pip install ruff flake8
          # Install type checking if mypy config exists
          if [ -f "pyproject.toml" ] || [ -f "mypy.ini" ]; then
            pip install mypy
          fi
          # Install project dependencies from ai/requirements.txt
          if [ -f "ai/requirements.txt" ]; then
            pip install -r ai/requirements.txt
          fi

      - name: Run tests with pytest
        run: |
          # Run tests if tests directory exists
          if [ -d "tests" ]; then
            python -m pytest tests/ -v --tb=short || echo "⚠️  Some tests failed but continuing CI"
          else
            echo "No tests directory found, skipping pytest"
          fi

      - name: Run ruff linting
        run: |
          # Run ruff if it's installed
          if command -v ruff &> /dev/null; then
            ruff check . --select E,F,W,C90 --ignore E501 || echo "⚠️  Linting found issues but continuing CI"
          else
            echo "Ruff not installed, skipping"
          fi
        continue-on-error: true

      - name: Run basic linting with flake8
        run: |
          # Run flake8 on Python files, allow failures for now
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "⚠️  Critical linting issues found but continuing CI"
        continue-on-error: true

      - name: Run type checking with mypy
        if: hashFiles('pyproject.toml', 'mypy.ini') != ''
        run: |
          mypy . || echo "⚠️  Type checking found issues but continuing CI"
        continue-on-error: true

      - name: Check Python syntax
        run: |
          # Basic Python syntax check
          python -m py_compile $(find . -name "*.py" -not -path "./.*" -not -path "*/\.*" | head -20) || echo "⚠️  Syntax issues found"
        continue-on-error: true

      - name: Report status
        if: always()
        run: |
          echo "✅ CI checks completed"
          echo "Note: Some checks are warnings-only and won't fail the build"
