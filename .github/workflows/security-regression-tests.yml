name: Focused Security Regression Tests

on:
  push:
    branches:
      - security/telegram-sender-authorization-20261115

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused security regressions
        run: python -m pytest -q --tb=short tests/test_telegram_sender_authorization.py tests/test_telegram_bridge_authorization.py
