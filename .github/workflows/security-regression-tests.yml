name: Security Regression Tests

on:
  pull_request:
    paths:
      - "api/**"
      - "autonomous/**"
      - "scripts/**"
      - "termux-hands-off/agents/**"
      - "tests/test_no_embedded_telegram_credentials.py"
      - "tests/test_finance_redaction_safety.py"
      - ".env*"
      - ".github/workflows/security-regression-tests.yml"

permissions:
  contents: read

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run credential and finance redaction regressions
        run: |
          python -m unittest -v \
            tests/test_no_embedded_telegram_credentials.py \
            tests/test_finance_redaction_safety.py
