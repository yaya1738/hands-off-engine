name: Pre-commit Checks

# Run pre-commit style checks in CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install pre-commit tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff ruff-format isort detect-secrets pyyaml jsonschema

      - name: Check formatting with ruff
        run: |
          echo "Checking Python code formatting..."
          ruff format --check . || echo "⚠️  Formatting issues found"
        continue-on-error: true

      - name: Check linting with ruff
        run: |
          echo "Running ruff linter..."
          ruff check . || echo "⚠️  Linting issues found"
        continue-on-error: true

      - name: Check imports with isort
        run: |
          echo "Checking import order..."
          isort --check-only --diff . || echo "⚠️  Import order issues found"
        continue-on-error: true

      - name: Validate YAML files
        run: |
          echo "Validating YAML files..."
          for file in $(find . -name "*.yml" -o -name "*.yaml" | grep -v ".git"); do
            echo "Checking $file"
            python -c "import yaml; yaml.safe_load(open('$file'))" || echo "⚠️  Invalid YAML: $file"
          done
        continue-on-error: true

      - name: Validate JSON files
        run: |
          echo "Validating JSON files..."
          for file in $(find . -name "*.json" | grep -v ".git" | grep -v "node_modules"); do
            echo "Checking $file"
            python -c "import json; json.load(open('$file'))" || echo "⚠️  Invalid JSON: $file"
          done
        continue-on-error: true

      - name: Check for secrets
        run: |
          echo "Scanning for potential secrets..."
          # Create baseline if it doesn't exist
          if [ ! -f ".secrets.baseline" ]; then
            detect-secrets scan --baseline .secrets.baseline || true
          fi
          # Scan for new secrets
          detect-secrets scan --baseline .secrets.baseline || echo "⚠️  Potential secrets detected"
        continue-on-error: true

      - name: Check shell scripts with shellcheck
        run: |
          # Install shellcheck if available
          if command -v apt-get &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y shellcheck || true
          fi
          
          if command -v shellcheck &> /dev/null; then
            echo "Checking shell scripts..."
            find . -name "*.sh" -not -path "./.git/*" -exec shellcheck {} \; || echo "⚠️  Shell script issues found"
          else
            echo "⊘ shellcheck not available, skipping shell script checks"
          fi
        continue-on-error: true

      - name: Report summary
        if: always()
        run: |
          echo "✅ Pre-commit checks completed"
          echo "Note: All checks are warnings-only and won't block the PR"
