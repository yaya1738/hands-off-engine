name: Mark Copilot PRs Ready for Review

# This workflow is deliberately manual-only.
# It changes exactly one explicitly selected trusted-bot draft PR to ready.
# Self-healing agents and PR-open events cannot invoke this workflow.

on:
  # Explicit human action only. No pull_request or automatic draft promotion.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Exact draft PR number to mark ready for independent review'
        required: true
        type: number

permissions:
  pull-requests: write

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Mark the explicitly selected draft PR ready for review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ inputs.pr_number }}
          TRUSTED_AUTHORS: "copilot,copilot-swe-agent,app/copilot-swe-agent,github-actions[bot],dependabot[bot]"
        run: |
          set -euo pipefail
          if [[ ! "$PR_NUM" =~ ^[1-9][0-9]*$ ]]; then
            echo "A single positive PR number is required."
            exit 1
          fi

          PR_INFO=$(gh pr view "$PR_NUM" --json isDraft,author,id)
          IS_DRAFT=$(jq -r '.isDraft' <<< "$PR_INFO")
          AUTHOR=$(jq -r '.author.login' <<< "$PR_INFO")
          PR_NODE_ID=$(jq -r '.id' <<< "$PR_INFO")

          if [[ "$IS_DRAFT" != "true" ]]; then
            echo "PR #$PR_NUM is not a draft; refusing to change its state."
            exit 1
          fi

          AUTHOR_LOWER=$(tr '[:upper:]' '[:lower:]' <<< "$AUTHOR")
          IS_TRUSTED=false
          IFS=',' read -ra TRUSTED <<< "$TRUSTED_AUTHORS"
          for candidate in "${TRUSTED[@]}"; do
            candidate_lower=$(tr '[:upper:]' '[:lower:]' <<< "$candidate")
            if [[ "$AUTHOR_LOWER" == "$candidate_lower" ]]; then
              IS_TRUSTED=true
              break
            fi
          done

          if [[ "$IS_TRUSTED" != "true" ]]; then
            echo "PR author '$AUTHOR' is not in the trusted author list; refusing."
            exit 1
          fi

          gh api graphql -f query='
            mutation($id: ID!) {
              markPullRequestReadyForReview(input: {pullRequestId: $id}) {
                pullRequest { isDraft }
              }
            }
          ' -f id="$PR_NODE_ID"
          echo "PR #$PR_NUM marked ready following explicit workflow_dispatch."
