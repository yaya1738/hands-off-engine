name: Mark Copilot PRs Ready for Review

on:
  pull_request:
    types: [opened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to mark ready (leave empty to process all draft PRs from trusted authors)
        required: false
        type: number

permissions:
  contents: read
  pull-requests: write

env:
  TRUSTED_AUTHORS: "copilot,copilot-swe-agent,app/copilot-swe-agent,github-actions[bot],dependabot[bot]"
  TRUSTED_OPERATORS: "yaya1738"

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.draft == true)
    steps:
      - name: Authorize manual operator
        if: github.event_name == 'workflow_dispatch'
        env:
          ACTOR: ${{ github.actor }}
          TRUSTED_OPERATORS: ${{ env.TRUSTED_OPERATORS }}
        run: |
          AUTHORIZED=false
          for trusted in $(printf '%s' "$TRUSTED_OPERATORS" | tr ',' ' '); do
            if [ "$(printf '%s' "$ACTOR" | tr '[:upper:]' '[:lower:]')" = "$(printf '%s' "$trusted" | tr '[:upper:]' '[:lower:]')" ]; then
              AUTHORIZED=true
              break
            fi
          done
          if [ "$AUTHORIZED" != true ]; then
            echo "::error::Manual mark-ready is restricted to trusted operators"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Process draft PRs
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_EVENT_NODE_ID: ${{ github.event.pull_request.node_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_AUTHORS: ${{ env.TRUSTED_AUTHORS }}
        run: |
          is_trusted() {
            local author_lower
            author_lower="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
            for trusted in $(printf '%s' "$TRUSTED_AUTHORS" | tr ',' ' '); do
              if [ "$author_lower" = "$(printf '%s' "$trusted" | tr '[:upper:]' '[:lower:]')" ]; then
                return 0
              fi
            done
            return 1
          }

          mark_ready() {
            local pr_number="$1"
            local node_id="$2"
            if ! printf '%s' "$pr_number" | grep -Eq '^[0-9]+$'; then
              echo "::error::Invalid PR number"
              return 1
            fi
            gh api graphql -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' -f id="$node_id"
            echo "PR #$pr_number marked ready for review"
          }

          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            if [ -n "$MANUAL_PR_NUMBER" ] && ! printf '%s' "$MANUAL_PR_NUMBER" | grep -Eq '^[0-9]+$'; then
              echo "::error::Invalid PR number"
              exit 1
            fi

            if [ -n "$MANUAL_PR_NUMBER" ]; then
              PR_DATA=$(gh pr view "$MANUAL_PR_NUMBER" --json number,isDraft,author,node_id)
              IS_DRAFT=$(printf '%s' "$PR_DATA" | jq -r '.isDraft')
              AUTHOR=$(printf '%s' "$PR_DATA" | jq -r '.author.login')
              NODE_ID=$(printf '%s' "$PR_DATA" | jq -r '.node_id')
              if [ "$IS_DRAFT" != true ] || ! is_trusted "$AUTHOR"; then
                echo "PR #$MANUAL_PR_NUMBER is not an eligible trusted draft"
                exit 0
              fi
              mark_ready "$MANUAL_PR_NUMBER" "$NODE_ID"
            else
              gh pr list --state open --json number,isDraft,author,node_id --jq '.[] | select(.isDraft == true)' |
                jq -c '.' | while read -r pr; do
                  PR_NUMBER=$(printf '%s' "$pr" | jq -r '.number')
                  AUTHOR=$(printf '%s' "$pr" | jq -r '.author.login')
                  NODE_ID=$(printf '%s' "$pr" | jq -r '.node_id')
                  if is_trusted "$AUTHOR"; then
                    mark_ready "$PR_NUMBER" "$NODE_ID"
                  fi
                done
            fi
          else
            if is_trusted "$PR_EVENT_AUTHOR"; then
              mark_ready "$PR_EVENT_NUMBER" "$PR_EVENT_NODE_ID"
            else
              echo "PR author $PR_EVENT_AUTHOR is not trusted; skipping"
            fi
          fi
