name: Manually mark a pull request ready (no merge)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Specific draft PR number to mark ready
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

env:
  TRUSTED_OPERATORS: "yaya1738"

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Authorize operator and mark one PR ready
        env:
          ACTOR: ${{ github.actor }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TRUSTED_OPERATORS: ${{ env.TRUSTED_OPERATORS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::A specific valid PR number is required"
            exit 1
          fi
          AUTHORIZED=false
          for operator in $(printf '%s' "$TRUSTED_OPERATORS" | tr ',' ' '); do
            if [ "$ACTOR" = "$operator" ]; then AUTHORIZED=true; fi
          done
          if [ "$AUTHORIZED" != true ]; then
            echo "::error::Actor is not authorized to mark PRs ready"
            exit 1
          fi
          PR_DATA=$(gh pr view "$PR_NUMBER" --json isDraft,id)
          IS_DRAFT=$(printf '%s' "$PR_DATA" | jq -r '.isDraft')
          NODE_ID=$(printf '%s' "$PR_DATA" | jq -r '.id')
          if [ "$IS_DRAFT" != "true" ] || [ -z "$NODE_ID" ] || [ "$NODE_ID" = "null" ]; then
            echo "::error::PR is not an open draft or has no node ID"
            exit 1
          fi
          gh api graphql -f query='mutation($id: ID!) { markPullRequestReadyForReview(input: {pullRequestId: $id}) { pullRequest { isDraft } } }' -f id="$NODE_ID"
          echo "PR #$PR_NUMBER marked ready. No merge was attempted."
