name: Repository-Native Production Authority Reconcile

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-production-authority
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve current main under authority lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          current_sha="$(git rev-parse origin/main)"
          git checkout --detach "$current_sha"
          test "$(git rev-parse HEAD)" = "$current_sha"
          test "$(git status --porcelain)" = ""
          echo "authority_revision=$current_sha"
          echo "authority_mode=repository_hosted"
          echo "external_remote_credentials_required=false"
          echo "financial_live_execution_enabled=false"

      - name: Install runtime dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Run deterministic deployment preflight
        run: python tools/factory_forensics/deployment_preflight.py .

      - name: Execute governed hosted production cycle
        run: python tools/autonomy_liveness_supervisor.py --once

      - name: Verify internal production authority
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          state = json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          att = state.get("live_attestation") or {}
          assert state.get("live_system_active") is True, state
          assert state.get("operating_state") in {"live_executing", "live_steady_state"}, state
          assert att.get("active") is True, state
          assert att.get("mechanism") == "governed_autonomous_supervisor_cycle", state
          observed = datetime.fromisoformat(str(att["observed_at"]).replace("Z", "+00:00"))
          expires_value = att["expires_at"]
          expires = datetime.fromtimestamp(float(expires_value), tz=timezone.utc) if isinstance(expires_value, (int, float)) else datetime.fromisoformat(str(expires_value).replace("Z", "+00:00"))
          now = datetime.now(timezone.utc)
          assert observed <= now <= expires, state
          if state.get("converged") is True:
              assert state.get("execution_succeeded") is False, state
              assert state.get("operating_state") == "live_steady_state", state
              print("REPOSITORY_NATIVE_PRODUCTION_CONVERGED")
              print("Governed autonomous authority is healthy and has reached verified steady state with a fresh attestation.")
          else:
              assert state.get("execution_observed") is True, state
              assert state.get("verification_observed") is True, state
              assert state.get("execution_succeeded") is True, state
              assert state.get("operating_state") == "live_executing", state
              print("REPOSITORY_NATIVE_PRODUCTION_OK")
              print("Governed autonomous production authority is active with a fresh attestation and no remote host credentials.")
          PY

      - name: Persist authority evidence
        run: |
          set -euo pipefail
          converged=$(python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          print("true" if state.get("converged") is True else "false")
          PY
          )
          transition=$(python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          mission=state.get("mission", {})
          print("true" if mission.get("convergence_transition") is True else "false")
          PY
          )
          if [ "$converged" = "true" ] && [ "$transition" != "true" ]; then
            echo "Verified converged steady state; no durable heartbeat commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            state/autonomy_liveness.json \
            state/autonomy_mission.json \
            state/autonomous_task_queue.json \
            state/autonomous_tasks_completed.jsonl \
            state/autonomous_task_attempts.jsonl \
            state/autonomous_tasks.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist repository-native authority state"
            git push origin HEAD:main
          fi

      - name: Publish authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-native-production-authority-${{ github.run_id }}
          path: |
            state/autonomy_liveness.json
            state/autonomy_mission.json
            state/autonomous_task_queue.json
            state/autonomous_tasks_completed.jsonl
            state/autonomous_task_attempts.jsonl
            state/autonomous_tasks.jsonl
          if-no-files-found: ignore
          retention-days: 14
