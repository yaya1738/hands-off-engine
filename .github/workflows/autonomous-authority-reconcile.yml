name: Repository-Native Production Authority Reconcile

on:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-production-authority
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Assert repository-native authority
        shell: bash
        run: |
          set -euo pipefail
          requested_sha='${{ github.sha }}'
          test "$(git rev-parse HEAD)" = "$requested_sha"
          test "$(git status --porcelain)" = ""
          echo "authority_mode=repository_hosted"
          echo "external_remote_credentials_required=false"
          echo "financial_live_execution_enabled=false"

      - name: Install runtime dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          fi

      - name: Run deterministic deployment preflight
        run: python tools/factory_forensics/deployment_preflight.py .

      - name: Execute governed hosted production cycle
        run: python tools/autonomy_liveness_supervisor.py --once

      - name: Verify internal production authority
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          assert state.get("execution_observed") is True, state
          assert state.get("verification_observed") is True, state
          assert state.get("execution_succeeded") is True, state
          assert state.get("live_system_active") is True, state
          print("REPOSITORY_NATIVE_PRODUCTION_OK")
          print("Governed autonomous production authority is active without remote host credentials.")
          PY

      - name: Persist authority evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in state/autonomy_liveness.json state/autonomous_task_queue.json state/autonomous_tasks_completed.jsonl state/autonomous_task_attempts.jsonl state/autonomous_tasks.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist repository-native authority state"
            git push origin HEAD:main
          fi

      - name: Publish authority evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-native-production-authority-${{ github.run_id }}
          path: |
            state/autonomy_liveness.json
            state/autonomous_task_queue.json
            state/autonomous_tasks_completed.jsonl
            state/autonomous_task_attempts.jsonl
            state/autonomous_tasks.jsonl
          if-no-files-found: ignore
          retention-days: 14
