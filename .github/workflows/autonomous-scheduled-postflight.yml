name: Autonomous Scheduled Postflight

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-scheduled-postflight
  cancel-in-progress: true

# Postflight may inspect persisted state but must never create a new liveness
# attestation. The canonical integrated production service owns execution.
jobs:
  postflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify persisted liveness contract without mutation
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('state/autonomy_liveness.json')
          if not p.exists():
              print('No persisted liveness state published yet.')
              raise SystemExit(0)
          data = json.loads(p.read_text(encoding='utf-8'))
          att = data.get('live_attestation') or {}
          try:
              expires = datetime.fromisoformat(att['expires_at'])
              fresh = expires >= datetime.now(timezone.utc)
          except (KeyError, TypeError, ValueError):
              fresh = False
          healthy = (
              data.get('live_system_active') is True
              and att.get('active') is True
              and att.get('mechanism') == 'governed_autonomous_supervisor_cycle'
              and fresh
              and data.get('operating_state') in {'live_executing', 'live_steady_state'}
          )
          print(json.dumps({'fresh_live_attestation': healthy, 'operating_state': data.get('operating_state')}, sort_keys=True))
          PY
      - name: Re-measure DASS structure without changing runtime state
        run: python tools/factory_forensics/dass_measurement.py
