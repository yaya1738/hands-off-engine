name: Actions Runner Boundary Canary

on:
  push:
    branches:
      - diagnostic/actions-runner-boundary-20260909
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prove runner execution boundary
        run: |
          set -euo pipefail
          echo "runner=$(uname -a)"
          echo "github_runner_os=${RUNNER_OS}"
          echo "github_runner_arch=${RUNNER_ARCH}"
          echo "runner_name=${RUNNER_NAME}"
          echo "runner_environment=${RUNNER_ENVIRONMENT:-unknown}"
          test -n "${RUNNER_NAME}"
          echo "ACTIONS_RUNNER_BOUNDARY_OK=true"
