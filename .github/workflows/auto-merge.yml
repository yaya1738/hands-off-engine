name: Auto-merge PRs

# Fail-closed repository automation.
# Ordinary PRs still require the explicit human approval label. The bounded
# repository-hosted Factory development lane is separately eligible for
# auto-merge when it is authored by github-actions[bot], uses the dedicated
# autonomous-factory/* branch namespace, passes all required checks, and is not
# a financial/live-trading change. Financial changes always retain the separate
# human-finance-approved gate. No workflow performs a direct merge.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, labeled]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to evaluate'
        required: true
        type: number
  repository_dispatch:
    types: [merge_pr]

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: read

env:
  TRUSTED_AUTHORS: "yaya1738,github-actions[bot],dependabot[bot]"
  HUMAN_APPROVAL_LABEL: "human-approved"
  FINANCE_APPROVAL_LABEL: "human-finance-approved"
  REPOSITORY_OWNER: "yaya1738"
  AUTONOMOUS_BRANCH_PREFIX: "autonomous-factory/"

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'repository_dispatch' ||
      github.event_name == 'check_suite' ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.draft == false ||
         contains(join(github.event.pull_request.labels.*.name, ','), 'human-approved')))
    steps:
      - name: Determine PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "number=${{ github.event.client_payload.pr_number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            branch="${{ github.event.check_suite.head_branch }}"
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number' 2>/dev/null || true)
            echo "number=$number" >> "$GITHUB_OUTPUT"
          fi

      - name: Convert owner-approved draft to ready
        if: steps.pr.outputs.number != '' && github.event_name == 'pull_request' && github.event.pull_request.draft == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          info=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable,author,labels)
          state=$(jq -r '.state' <<<"$info")
          draft=$(jq -r '.isDraft' <<<"$info")
          mergeable=$(jq -r '.mergeable' <<<"$info")
          author=$(jq -r '.author.login' <<<"$info")
          has_human=$(jq -r --arg label "$HUMAN_APPROVAL_LABEL" '[.labels[].name | ascii_downcase] | index(($label | ascii_downcase)) != null' <<<"$info")

          [ "$state" = "OPEN" ] || { echo "DENY: PR is not open"; exit 1; }
          [ "$draft" = "true" ] || { echo "DENY: PR is no longer draft"; exit 1; }
          [ "$author" = "$REPOSITORY_OWNER" ] || { echo "DENY: author is not repository owner"; exit 1; }
          [ "$has_human" = "true" ] || { echo "DENY: explicit human approval label missing"; exit 1; }
          [ "$mergeable" = "MERGEABLE" ] || { echo "DENY: PR is not mergeable"; exit 1; }

          node_id=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.node_id')
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
            -F id="$node_id" \
            --jq '.data.markPullRequestReadyForReview.pullRequest.isDraft' | grep -qx 'false'
          echo "Owner-approved mergeable draft transitioned to ready via minimal GraphQL mutation."

      - name: Fail-closed eligibility check
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pr="${{ steps.pr.outputs.number }}"
          info=$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,isDraft,mergeable,author,headRefName,labels)

          state=$(jq -r '.state' <<<"$info")
          draft=$(jq -r '.isDraft' <<<"$info")
          mergeable=$(jq -r '.mergeable' <<<"$info")
          author=$(jq -r '.author.login' <<<"$info")
          head=$(jq -r '.headRefName' <<<"$info")
          labels=$(jq -r '[.labels[].name] | map(ascii_downcase) | .[]' <<<"$info")

          [ "$state" = "OPEN" ] || { echo "DENY: PR is not open"; exit 0; }
          [ "$draft" = "false" ] || { echo "DENY: PR is draft"; exit 0; }
          [ "$mergeable" = "MERGEABLE" ] || { echo "DENY: PR is not mergeable"; exit 0; }

          trusted=false
          author_lc=$(tr '[:upper:]' '[:lower:]' <<<"$author")
          IFS=',' read -ra trusted_list <<<"$TRUSTED_AUTHORS"
          for candidate in "${trusted_list[@]}"; do
            [ "$author_lc" = "$(tr '[:upper:]' '[:lower:]' <<<"$candidate")" ] && trusted=true
          done
          $trusted || { echo "DENY: author is not trusted"; exit 0; }

          has_human=false
          while IFS= read -r label; do
            [ "$label" = "$HUMAN_APPROVAL_LABEL" ] && has_human=true
          done <<<"$labels"

          autonomous=false
          if [ "$author_lc" = "github-actions[bot]" ] && [[ "$head" == "$AUTONOMOUS_BRANCH_PREFIX"* ]]; then
            autonomous=true
          fi

          if ! $has_human && ! $autonomous; then
            echo "DENY: explicit human approval label missing and PR is not an authorized autonomous Factory PR"
            exit 0
          fi

          # Auto-merge must never rely on an unprotected main branch. Require at
          # least one completed passing check and reject any failed, cancelled,
          # timed-out, or still-pending check before enabling merge. Exclude this
          # workflow's own check so it cannot block itself while still running.
          checks=$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" --json name,bucket)
          checks_for_validation=$(jq '[.[] | select(.name != "auto-merge")]' <<<"$checks")
          check_count=$(jq 'length' <<<"$checks_for_validation")
          passed_count=$(jq '[.[] | select(.bucket == "pass")] | length' <<<"$checks_for_validation")
          blocking_count=$(jq '[.[] | select(.bucket != "pass" and .bucket != "skipping")] | length' <<<"$checks_for_validation")
          [ "$check_count" -gt 0 ] || { echo "DENY: no external CI checks are registered for this PR"; exit 0; }
          [ "$blocking_count" -eq 0 ] || { echo "DENY: external CI checks are not fully passing"; exit 0; }
          [ "$passed_count" -gt 0 ] || { echo "DENY: no passing external CI check exists"; exit 0; }
          echo "Validation gate passed: $passed_count passing external check(s), $check_count external check(s)."

          # Financial changes always require the domain-specific human approval,
          # including autonomous Factory PRs.
          changed=$(gh pr diff "$pr" --repo "$GITHUB_REPOSITORY" --name-only)
          if grep -Eiq '(^|/)(polymarket|trading|finance|financial|executor)(/|_|\.|$)|POLYMARKET|LIVE_TRADING' <<<"$changed"; then
            has_finance=false
            while IFS= read -r label; do
              [ "$label" = "$FINANCE_APPROVAL_LABEL" ] && has_finance=true
            done <<<"$labels"
            $has_finance || { echo "DENY: financial approval label missing"; exit 0; }
          fi

          echo "Eligibility passed; enabling GitHub auto-merge only. autonomous_lane=$autonomous human_lane=$has_human"
          gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --squash --auto
