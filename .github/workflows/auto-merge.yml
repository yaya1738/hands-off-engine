name: Auto-merge PRs

# Automatically merges PRs that meet safety criteria:
# - Created by trusted AI agents (Copilot, dependabot)
# - All checks passing
# - Low-risk changes (docs, tests, non-critical code)

on:
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to auto-merge'
        required: false
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for mergeable PRs
        id: check_prs
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR number from input or find from event
            let prNumber = context.payload.inputs?.pr_number;
            
            if (!prNumber) {
              // For check_suite events, find associated PR
              if (context.eventName === 'check_suite') {
                const suite = context.payload.check_suite;
                if (suite.pull_requests && suite.pull_requests.length > 0) {
                  prNumber = suite.pull_requests[0].number;
                }
              }
              // For PR review events
              else if (context.eventName === 'pull_request_review') {
                prNumber = context.payload.pull_request.number;
              }
            }
            
            if (!prNumber) {
              console.log('No PR associated with this event');
              return;
            }
            
            // Get PR details
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            console.log(`Checking PR #${prNumber}: ${pr.title}`);
            
            // Safety checks - use exact matching for trusted authors
            const trustedAuthors = [
              'github-actions[bot]',
              'dependabot[bot]',
              'copilot[bot]',
              'github-copilot[bot]'
            ];
            
            const isTrustedAuthor = trustedAuthors.includes(pr.user.login);
            
            // Check if PR has safe labels or changes only safe files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const riskyPatterns = [
              /^executor\//,
              /^alpha\//,
              /^decider\//,
              /config/,
              /\.env/,
              /crontab/,
              /requirements\.txt$/,
              /package\.json$/
            ];
            
            // A file is safe if it's NOT risky
            const allFilesAreSafe = files.every(file => 
              !riskyPatterns.some(pattern => pattern.test(file.filename))
            );
            
            // Check if all status checks pass
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });
            
            const allChecksPassing = checks.check_runs.every(check => 
              check.conclusion === 'success' || check.conclusion === 'skipped'
            ) || checks.check_runs.length === 0;
            
            // Determine if PR is auto-mergeable
            // SECURITY: Require BOTH trusted author AND safe files to auto-merge
            const canAutoMerge = pr.mergeable && 
                                 pr.mergeable_state === 'clean' &&
                                 allChecksPassing &&
                                 isTrustedAuthor &&
                                 allFilesAreSafe;
            
            console.log(`Author trusted: ${isTrustedAuthor}`);
            console.log(`All files safe: ${allFilesAreSafe}`);
            console.log(`All checks passing: ${allChecksPassing}`);
            console.log(`PR mergeable: ${pr.mergeable}`);
            console.log(`Can auto-merge: ${canAutoMerge}`);
            
            if (canAutoMerge) {
              core.setOutput('pr_number', prNumber);
              core.setOutput('can_merge', 'true');
            } else {
              core.setOutput('can_merge', 'false');
            }

      - name: Auto-merge PR
        if: steps.check_prs.outputs.can_merge == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.check_prs.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (!prNumber || prNumber === 0) {
              console.log('No PR number available');
              return;
            }
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                merge_method: 'squash'
              });
              
              console.log(`Successfully merged PR #${prNumber}`);
              
            } catch (error) {
              console.error(`Failed to merge PR #${prNumber}:`, error.message);
              throw error;
            }

      - name: Notify on merge failure
        if: failure()
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.check_prs.outputs.pr_number }}
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            if (prNumber > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: '⚠️ Auto-merge attempted but failed. Please review and merge manually if appropriate.'
              });
            }
