name: Auto-merge PRs

# Automatically merge PRs without user intervention
# Merges trusted-source PRs when ready and checks pass.
#
# Manual workflow_dispatch remains an explicit override.

on:
  pull_request:
    types: [opened, ready_for_review, synchronize]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to merge'
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

env:
  TRUSTED_AUTHORS: "copilot,copilot-swe-agent,app/copilot-swe-agent,github-actions[bot],dependabot[bot]"

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'check_suite' && github.event.check_suite.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Determine PR number
        id: pr_number
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PR_NUMBER: ${{ github.event.inputs.pr_number }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          CHECK_SUITE_HEAD_BRANCH: ${{ github.event.check_suite.head_branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! printf '%s' "$MANUAL_PR_NUMBER" | grep -Eq '^[0-9]+$'; then
              echo "::error::Invalid PR number"
              exit 1
            fi
            printf 'pr=%s\n' "$MANUAL_PR_NUMBER" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            printf 'pr=%s\n' "$PR_EVENT_NUMBER" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "check_suite" ]; then
            HEAD_BRANCH="$CHECK_SUITE_HEAD_BRANCH"
            PR=$(gh pr list --json number,headRefName --jq '.[] | select(.headRefName == $branch) | .number' --arg branch "$HEAD_BRANCH" 2>/dev/null | head -1)
            printf 'pr=%s\n' "$PR" >> "$GITHUB_OUTPUT"
          fi

      - name: Check PR and auto-merge
        if: steps.pr_number.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_AUTHORS: ${{ env.TRUSTED_AUTHORS }}
          PR_NUM: ${{ steps.pr_number.outputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if ! printf '%s' "$PR_NUM" | grep -Eq '^[0-9]+$'; then
            echo "::error::Invalid PR number"
            exit 1
          fi

          echo "Processing PR #$PR_NUM..."
          PR_INFO=$(gh pr view "$PR_NUM" --json state,mergeable,mergeStateStatus,isDraft,author,statusCheckRollup,title,headRefName 2>/dev/null) || {
            echo "Failed to get PR info"
            exit 0
          }

          STATE=$(echo "$PR_INFO" | jq -r '.state')
          MERGEABLE=$(echo "$PR_INFO" | jq -r '.mergeable')
          IS_DRAFT=$(echo "$PR_INFO" | jq -r '.isDraft')
          AUTHOR=$(echo "$PR_INFO" | jq -r '.author.login')
          TITLE=$(echo "$PR_INFO" | jq -r '.title')

          echo "PR #$PR_NUM: $TITLE"
          echo "  State: $STATE"
          echo "  Mergeable: $MERGEABLE"
          echo "  Draft: $IS_DRAFT"
          echo "  Author: $AUTHOR"

          if [ "$STATE" != "OPEN" ] || [ "$IS_DRAFT" == "true" ] || [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "PR is not currently eligible"
            exit 0
          fi

          CHECKS_PASSED=$(echo "$PR_INFO" | jq '[.statusCheckRollup[]? | select(.status == "COMPLETED") | .conclusion] | all(. == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL")')
          HAS_PENDING=$(echo "$PR_INFO" | jq '[.statusCheckRollup[]? | .status] | any(. == "PENDING" or . == "QUEUED" or . == "IN_PROGRESS")')

          if [ "$HAS_PENDING" == "true" ]; then
            echo "PR has pending checks, skipping for now"
            exit 0
          fi
          if [ "$CHECKS_PASSED" != "true" ]; then
            echo "Some checks failed, skipping"
            exit 0
          fi

          SHOULD_MERGE="false"
          AUTHOR_LOWER=$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')
          for trusted in $(echo "$TRUSTED_AUTHORS" | tr ',' ' '); do
            trusted_lower=$(echo "$trusted" | tr '[:upper:]' '[:lower:]')
            if [ "$AUTHOR_LOWER" == "$trusted_lower" ]; then
              echo "PR is from trusted source ($AUTHOR), will auto-merge"
              SHOULD_MERGE="true"
              break
            fi
          done

          if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
            echo "Manual trigger, will attempt merge"
            SHOULD_MERGE="true"
          fi

          if [ "$SHOULD_MERGE" != "true" ]; then
            echo "PR does not meet auto-merge criteria"
            exit 0
          fi

          echo "Enabling auto-merge for PR #$PR_NUM..."
          AUTO_MERGE_OUTPUT=$(gh pr merge "$PR_NUM" --squash --auto 2>&1) && echo "Auto-merge enabled" || echo "Auto-merge setup returned: $AUTO_MERGE_OUTPUT"

          echo "Attempting direct merge..."
          MERGE_OUTPUT=$(gh pr merge "$PR_NUM" --squash --delete-branch 2>&1) && {
            echo "PR #$PR_NUM merged successfully"
          } || {
            echo "Direct merge returned: $MERGE_OUTPUT"
            echo "Auto-merge may be pending until branch protections are satisfied"
          }

  mark-ready-and-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review'

    steps:
      - name: Auto-merge ready PR from trusted source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_AUTHORS: ${{ env.TRUSTED_AUTHORS }}
          PR_EVENT_NUMBER: ${{ github.event.pull_request.number }}
          PR_EVENT_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if ! printf '%s' "$PR_EVENT_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::Invalid PR number"
            exit 1
          fi

          PR_NUM="$PR_EVENT_NUMBER"
          AUTHOR="$PR_EVENT_AUTHOR"
          AUTHOR_LOWER=$(echo "$AUTHOR" | tr '[:upper:]' '[:lower:]')

          echo "PR #$PR_NUM is now ready for review (author: $AUTHOR)"

          IS_TRUSTED="false"
          for trusted in $(echo "$TRUSTED_AUTHORS" | tr ',' ' '); do
            trusted_lower=$(echo "$trusted" | tr '[:upper:]' '[:lower:]')
            if [ "$AUTHOR_LOWER" == "$trusted_lower" ]; then
              IS_TRUSTED="true"
              break
            fi
          done

          if [ "$IS_TRUSTED" != "true" ]; then
            echo "Author $AUTHOR is not in trusted list, skipping"
            exit 0
          fi

          echo "Author $AUTHOR is trusted, enabling auto-merge"
          AUTO_MERGE_OUTPUT=$(gh pr merge "$PR_NUM" --squash --auto 2>&1) && {
            echo "Auto-merge enabled for PR #$PR_NUM"
          } || {
            echo "Auto-merge setup returned: $AUTO_MERGE_OUTPUT"
          }
