name: Merge authorization status (read-only)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to inspect
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Explain merge authority boundary
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          if ! printf '%s' "$PR_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "::error::Invalid PR number"
            exit 1
          fi
          echo "PR #$PR_NUMBER: automated merge is disabled."
          echo "This workflow is read-only and cannot approve, mark ready, enable auto-merge, or merge."
          echo "Use independent human review and repository protection controls."
