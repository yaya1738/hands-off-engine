name: Task Assignment Handler

on:
  issues:
    types: [labeled]

jobs:
  assign-to-copilot:
    if: contains(github.event.label.name, 'copilot-task')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Log task assignment
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          echo "Issue #${ISSUE_NUMBER} assigned to Copilot agent"
          printf 'Title: %s\n' "${ISSUE_TITLE}"
          printf 'Created by: %s\n' "${ISSUE_AUTHOR}"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Update coordination status
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          mkdir -p ai/coordination
          jq -cn --arg timestamp "$TIMESTAMP" --argjson issue "$ISSUE_NUMBER" --arg title "$ISSUE_TITLE" \
            '{timestamp:$timestamp,issue:$issue,status:"assigned",agent:"copilot",title:$title}' \
            >> ai/coordination/copilot_tasks.jsonl
          echo "Issue #${ISSUE_NUMBER} logged to coordination system"

      - name: Commit and push coordination updates
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ai/coordination/copilot_tasks.jsonl
          git diff --staged --quiet || git commit -m "chore: Log Copilot task assignment #${ISSUE_NUMBER}"
          git push

      - name: Add comment to issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🤖 **Copilot Agent assigned**\n\nThis task has been assigned to the GitHub Copilot coding agent. The agent will:\n1. Read project context from `state/knowledge.json`\n2. Check current system state in `ai/coordination/status.json`\n3. Create a branch and implement the solution\n4. Open a PR for review\n\nTracking this task in `ai/coordination/copilot_tasks.jsonl`'
            })
