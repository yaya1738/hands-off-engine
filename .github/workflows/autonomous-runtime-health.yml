name: Autonomous Runtime Health

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-runtime-health
  cancel-in-progress: true

# Observational only. The canonical integrated production service is the sole
# workflow permitted to execute the governed runtime cycle and establish a
# live-state attestation.
jobs:
  runtime-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate runtime syntax
        run: python -m compileall -q ai/factory tools
      - name: Verify canonical runtime contract
        run: |
          set -euo pipefail
          test -f tools/autonomous_integrated_supervisor.py
          test -f tools/autonomy_liveness_supervisor.py
          test -f tools/factory_forensics/dass_phase.py
          test -f .github/workflows/autonomous-production-service.yml
          grep -q 'tools/autonomous_integrated_supervisor.py' .github/workflows/autonomous-production-service.yml
      - name: Inspect persisted liveness without mutating it
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path('state/autonomy_liveness.json')
          if not p.exists():
              print('No persisted liveness state published yet.')
              raise SystemExit(0)
          state = json.loads(p.read_text(encoding='utf-8'))
          att = state.get('live_attestation') or {}
          try:
              expires = datetime.fromisoformat(att['expires_at'])
              healthy = (
                  state.get('live_system_active') is True
                  and att.get('active') is True
                  and att.get('mechanism') == 'governed_autonomous_supervisor_cycle'
                  and expires >= datetime.now(timezone.utc)
                  and state.get('operating_state') in {'live_executing', 'live_steady_state'}
              )
          except (KeyError, TypeError, ValueError):
              healthy = False
          print(f'persisted_live_attestation={healthy}')
          print(f"operating_state={state.get('operating_state')}")
          PY
