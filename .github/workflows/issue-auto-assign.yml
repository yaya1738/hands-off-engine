name: Issue Auto-Assignment

# Automatically assigns new issues to Copilot for triage
# This reduces user effort by ensuring issues are handled autonomously

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  auto-assign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-assign issue to Copilot
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const issueNumber = issue.number;
            const issueTitle = issue.title;
            const issueBody = issue.body || '';
            
            console.log('New issue #' + issueNumber + ': ' + issueTitle);
            
            // Determine labels based on issue content
            const labels = [];
            const lowerTitle = issueTitle.toLowerCase();
            const lowerBody = issueBody.toLowerCase();
            
            if (lowerTitle.includes('bug') || lowerBody.includes('bug')) {
              labels.push('bug');
            }
            if (lowerTitle.includes('feature') || lowerBody.includes('feature')) {
              labels.push('enhancement');
            }
            if (lowerTitle.includes('doc') || lowerBody.includes('documentation')) {
              labels.push('documentation');
            }
            if (lowerTitle.includes('urgent') || lowerTitle.includes('critical')) {
              labels.push('priority:high');
            }
            
            // Add copilot-assigned label for tracking
            labels.push('copilot-assigned');
            
            // Add labels if any
            if (labels.length > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  labels: labels
                });
                console.log('Added labels: ' + labels.join(', '));
              } catch (error) {
                console.log('Could not add labels: ' + error.message);
              }
            }
            
            // Build comment body
            const labelsApplied = labels.length > 0 ? labels.join(', ') : 'none';
            const commentBody = [
              '👋 Thanks for opening this issue!',
              '',
              '🤖 Copilot has been automatically assigned to triage this issue.',
              '',
              'What happens next:',
              '- Copilot will analyze this issue and determine next steps',
              '- If this requires immediate attention, it will be escalated',
              '- For feature requests, a plan will be created',
              '',
              'Labels applied: ' + labelsApplied,
              '',
              '---',
              'This is an automated response from the Hands-Off Engine.'
            ].join('\n');
            
            // Post acknowledgment comment
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: commentBody
            });
            
            console.log('Issue #' + issueNumber + ' auto-assigned and acknowledged');
