name: CodeQL Security Analysis

# CodeQL analyzes code to find security vulnerabilities
# Critical for this project which handles:
# - API keys (Alpaca, OpenAI, Telegram, Polymarket)
# - Trading credentials
# - Financial operations

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run weekly on Mondays at 10:00 UTC
    - cron: '0 10 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Python Code
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]
        # CodeQL supports: 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby'
        # This repository is primarily Python

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        # Queries to run (default, security-extended, or security-and-quality)
        # Using security-extended for trading system
        queries: security-extended
        # If you need to specify build commands for compiled languages:
        # config-file: ./.github/codeql/codeql-config.yml

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4
      # Autobuild attempts to build any compiled languages
      # For Python, this is typically not needed but included for completeness

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
        # Upload results to GitHub Security tab
        upload: true
        # Fail the build if critical vulnerabilities found
        # Uncomment to enforce:
        # fail-on: critical
