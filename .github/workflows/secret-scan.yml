name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject committed credential patterns
        shell: bash
        run: |
          set -euo pipefail
          status=0
          patterns=(
            'dop_v1_[A-Za-z0-9]+'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
            'POLYMARKET_PRIVATE_KEY[[:space:]]*=[[:space:]]*["'"']0x[0-9a-fA-F]{64}["'"']'
            'OPENAI_API_KEY[[:space:]]*=[[:space:]]*["'"']sk-[^"'"'[:space:]]+'
          )
          for pattern in "${patterns[@]}"; do
            if git grep -n -E "$pattern" -- ':!docs/forensics/**' ':!*.lock' ':!*.sum'; then
              echo "Credential-like material detected: $pattern" >&2
              status=1
            fi
          done
          exit "$status"
