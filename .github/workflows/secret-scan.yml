name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Reject newly introduced credential patterns
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            files=$(git diff --name-only HEAD^ HEAD)
          else
            files=$(git ls-files)
          fi
          status=0
          patterns=(
            'dop_v1_[A-Za-z0-9]+'
            '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----'
            'POLYMARKET_PRIVATE_KEY[[:space:]]*=[[:space:]]*["'"']0x[0-9a-fA-F]{64}["'"']'
            'OPENAI_API_KEY[[:space:]]*=[[:space:]]*["'"']sk-[^"'"'[:space:]]+'
          )
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            case "$file" in
              docs/forensics/*|*.lock|*.sum) continue ;;
            esac
            for pattern in "${patterns[@]}"; do
              if grep -n -E "$pattern" -- "$file"; then
                echo "Credential-like material detected in $file: $pattern" >&2
                status=1
              fi
            done
          done <<< "$files"
          exit "$status"
