name: Human participant routing policy tests

on:
  pull_request:
    paths:
      - "messaging/human_participant_policy.py"
      - "tests/test_human_participant_policy.py"
      - ".github/workflows/human-participant-policy-tests.yml"
  push:
    branches:
      - "feat/human-participant-email-loop"
    paths:
      - "messaging/human_participant_policy.py"
      - "tests/test_human_participant_policy.py"
      - ".github/workflows/human-participant-policy-tests.yml"

permissions:
  contents: read

jobs:
  routing-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m pytest -q tests/test_human_participant_policy.py
