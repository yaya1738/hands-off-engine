name: Autonomous Copilot Agent

on:
  # Check for work every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Trigger when coordination files are updated
  push:
    paths:
      - 'ai/coordination/**'
      - 'ai/AUTONOMOUS_COPILOT_AGENT.md'
  
  # Trigger on PR and issue activity
  pull_request:
    types: [opened, synchronize, reopened]
  
  issue_comment:
    types: [created]
  
  # Manual trigger
  workflow_dispatch:

jobs:
  check-autonomous-work:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Check for autonomous work
        id: check_work
        run: |
          python ai/autonomous_copilot_agent.py > work_output.txt
          EXIT_CODE=$?
          
          if [ $EXIT_CODE -eq 0 ]; then
            echo "work_found=true" >> $GITHUB_OUTPUT
            echo "WORK DETECTED - Copilot action required"
          else
            echo "work_found=false" >> $GITHUB_OUTPUT
            echo "No autonomous work detected"
          fi
          
          cat work_output.txt
      
      - name: Create Copilot trigger issue
        if: steps.check_work.outputs.work_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Read the trigger comment from the agent output
            const fs = require('fs');
            const output = fs.readFileSync('work_output.txt', 'utf8');
            
            // Extract the trigger comment (between the === markers)
            const triggerMatch = output.match(/TRIGGER COMMENT.*?={60}\n([\s\S]*?)\n={60}/);
            
            if (triggerMatch && triggerMatch[1]) {
              const triggerComment = triggerMatch[1].trim();
              
              // Check if there's an autonomous coordination issue
              // If not, create one
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'autonomous-coordination',
                state: 'open'
              });
              
              let issueNumber;
              
              if (issues.data.length === 0) {
                // Create autonomous coordination issue
                const newIssue = await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '🤖 Autonomous AI Coordination Hub',
                  body: `This issue is used for autonomous AI agent coordination.
                  
AI agents (Copilot, Claude, ChatGPT) post here to coordinate work without manual user prompting.

**Status**: Active
**Mode**: Autonomous operation enabled
**Last check**: ${new Date().toISOString()}`,
                  labels: ['autonomous-coordination', 'ai-nexus']
                });
                issueNumber = newIssue.data.number;
              } else {
                issueNumber = issues.data[0].number;
              }
              
              // Post the trigger comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: `**🤖 Autonomous Work Detected** (${new Date().toISOString()})

${triggerComment}

---
_This is an autonomous action. No user prompt required._`
              });
              
              console.log(`Posted trigger to issue #${issueNumber}`);
            }
      
      - name: Log autonomous check
        if: always()
        run: |
          echo "Autonomous check completed at $(date)"
          echo "Work found: ${{ steps.check_work.outputs.work_found }}"
