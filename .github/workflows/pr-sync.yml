name: PR Sync and Management

# Automatically syncs PRs and manages branch updates
# - Auto-updates PRs when base branch changes
# - Labels PRs based on file changes
# - Auto-requests reviews when appropriate

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    # Run daily at 6 AM UTC to check stale PRs
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update PR branches on base change
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // Get all open PRs targeting the updated branch
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: context.ref.replace('refs/heads/', ''),
              state: 'open'
            });
            
            console.log(`Found ${prs.length} open PRs targeting ${context.ref}`);
            
            for (const pr of prs) {
              // Check if PR is behind
              const { data: comparison } = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: pr.head.sha,
                head: pr.base.sha
              });
              
              if (comparison.behind_by > 0) {
                console.log(`PR #${pr.number} is ${comparison.behind_by} commits behind`);
                
                try {
                  await github.rest.pulls.updateBranch({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: pr.number
                  });
                  console.log(`Updated PR #${pr.number} branch`);
                } catch (error) {
                  // Handle specific error types for better debugging
                  if (error.status === 422) {
                    console.log(`PR #${pr.number}: merge conflict or branch protection prevents update`);
                  } else if (error.status === 403) {
                    console.log(`PR #${pr.number}: permission denied - check workflow permissions`);
                  } else if (error.status === 404) {
                    console.log(`PR #${pr.number}: branch not found - may have been deleted`);
                  } else {
                    console.log(`PR #${pr.number}: unexpected error (${error.status}): ${error.message}`);
                  }
                }
              }
            }

      - name: Label PRs based on changes
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            
            // Get changed files
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            
            const labels = new Set();
            
            // Determine labels based on file patterns
            for (const file of files) {
              const filename = file.filename;
              
              if (filename.startsWith('docs/') || filename.endsWith('.md')) {
                labels.add('documentation');
              }
              if (filename.startsWith('tests/') || filename.includes('test_')) {
                labels.add('testing');
              }
              if (filename.startsWith('ai/')) {
                labels.add('ai-coordination');
              }
              if (filename.startsWith('scripts/')) {
                labels.add('automation');
              }
              if (filename.startsWith('.github/')) {
                labels.add('ci-cd');
              }
              if (filename.startsWith('executor/') || filename.startsWith('alpha/') || filename.startsWith('decider/')) {
                labels.add('trading-core');
                labels.add('needs-review');
              }
              if (filename.includes('config') || filename.includes('.env')) {
                labels.add('configuration');
                labels.add('needs-review');
              }
            }
            
            if (labels.size > 0) {
              try {
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: Array.from(labels)
                });
                console.log(`Added labels: ${Array.from(labels).join(', ')}`);
              } catch (error) {
                console.log(`Could not add labels: ${error.message}`);
              }
            }

      - name: Check and notify stale PRs
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'updated',
              direction: 'asc'
            });
            
            const now = new Date();
            const staleDays = 7;
            
            for (const pr of prs) {
              const updatedAt = new Date(pr.updated_at);
              const daysSinceUpdate = (now - updatedAt) / (1000 * 60 * 60 * 24);
              
              if (daysSinceUpdate > staleDays) {
                console.log(`PR #${pr.number} is stale (${Math.floor(daysSinceUpdate)} days since update)`);
                
                // Check if already has stale label
                const hasStaleLabel = pr.labels.some(label => label.name === 'stale');
                
                if (!hasStaleLabel) {
                  try {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      labels: ['stale']
                    });
                    
                    await github.rest.issues.createComment({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: pr.number,
                      body: `⏰ This PR has been inactive for ${Math.floor(daysSinceUpdate)} days. Please update or close if no longer needed.`
                    });
                  } catch (error) {
                    console.log(`Could not mark PR #${pr.number} as stale: ${error.message}`);
                  }
                }
              }
            }
            
            // Log coordination message
            const coordinationMsg = {
              timestamp: new Date().toISOString(),
              from: 'github-actions',
              to: 'all',
              type: 'info',
              message: `PR sync check complete. Found ${prs.length} open PRs.`,
              context: { action: 'pr-sync', open_prs: prs.length }
            };
            console.log('Coordination:', JSON.stringify(coordinationMsg));
