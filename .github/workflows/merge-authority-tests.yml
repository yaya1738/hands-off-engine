name: Merge authority regression tests

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/auto-merge.yml"
      - ".github/workflows/mark-ready.yml"
      - "scripts/coordination_agent.py"
      - "scripts/merge_authority.py"
      - "tests/test_merge_authority_boundaries.py"
      - ".github/workflows/merge-authority-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run merge authority regression tests
        run: python -m unittest tests/test_merge_authority_boundaries.py -v
