name: Autonomous Continuous Integrity

on:
  schedule:
    - cron: "2,17,32,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autonomous-continuous-integrity
  cancel-in-progress: true

jobs:
  dass:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Measure DASS
        run: python tools/factory_forensics/dass_measurement.py

  python-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile runtime Python
        run: python -m compileall -q ai tools

  workflow-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Parse workflow YAML
        run: |
          python -m pip install --disable-pip-version-check pyyaml
          python - <<'PY'
          from pathlib import Path
          import yaml
          for p in Path('.github/workflows').glob('*.y*ml'):
              with p.open(encoding='utf-8') as f:
                  yaml.safe_load(f)
              print('valid:', p)
          PY

  repository-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify clean checkout and required DASS surfaces
        run: |
          test -z "$(git status --porcelain)"
          test -f tools/factory_forensics/dass_measurement.py
          test -f tools/autonomy_liveness_supervisor.py
          test -f .github/workflows/autonomous-production-service.yml
