name: Deploy Self-Hosted Runner to Droplet

# Deploy GitHub Actions runner to DigitalOcean droplet
# Requires SSH access to the droplet

on:
  workflow_dispatch:
    inputs:
      droplet_ip:
        description: 'Droplet IP or hostname (e.g., do138 or 192.0.2.1)'
        required: true
        default: 'do138'
      ssh_user:
        description: 'SSH user for droplet'
        required: false
        default: 'root'
  repository_dispatch:
    types: [telegram_trigger_runner]  # Requires TELEGRAM_RUNNER_TOKEN authentication.

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Authenticate Telegram runner caller
        if: github.event_name == 'repository_dispatch'
        env:
          TELEGRAM_RUNNER_TOKEN: ${{ secrets.TELEGRAM_RUNNER_TOKEN }}
          PROVIDED_TOKEN: ${{ github.event.client_payload.webhook_token }}
        run: |
          if [ -z "$TELEGRAM_RUNNER_TOKEN" ]; then
            echo "::error::TELEGRAM_RUNNER_TOKEN repository secret is not configured"
            exit 1
          fi
          if [ -z "$PROVIDED_TOKEN" ]; then
            echo "::error::Missing Telegram runner authentication token"
            exit 1
          fi
          TELEGRAM_RUNNER_TOKEN="$TELEGRAM_RUNNER_TOKEN" PROVIDED_TOKEN="$PROVIDED_TOKEN" python - <<'PY'
          import hmac
          import os
          if not hmac.compare_digest(os.environ["TELEGRAM_RUNNER_TOKEN"], os.environ["PROVIDED_TOKEN"]):
              print("::error::Invalid Telegram runner authentication")
              raise SystemExit(1)
          PY
          echo "Telegram runner caller authenticated"

      - name: Determine Input Values
        id: inputs
        env:
          DISPATCH_DROPLET_IP: ${{ github.event.client_payload.droplet_ip || 'do138' }}
          DISPATCH_SSH_USER: ${{ github.event.client_payload.ssh_user || 'root' }}
          MANUAL_DROPLET_IP: ${{ github.event.inputs.droplet_ip }}
          MANUAL_SSH_USER: ${{ github.event.inputs.ssh_user }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then
            DROPLET_IP="$DISPATCH_DROPLET_IP"
            SSH_USER="$DISPATCH_SSH_USER"
          else
            DROPLET_IP="$MANUAL_DROPLET_IP"
            SSH_USER="$MANUAL_SSH_USER"
          fi
          if ! printf "%s" "$DROPLET_IP" | grep -Eq "^[A-Za-z0-9][A-Za-z0-9.-]{0,252}$"; then
            echo "::error::Invalid droplet host"
            exit 1
          fi
          if ! printf "%s" "$SSH_USER" | grep -Eq "^[A-Za-z_][A-Za-z0-9_.-]{0,31}$"; then
            echo "::error::Invalid SSH user"
            exit 1
          fi
          printf "droplet_ip=%s\n" "$DROPLET_IP" >> "$GITHUB_OUTPUT"
          printf "ssh_user=%s\n" "$SSH_USER" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'

      - name: Get Runner Registration Token
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          echo "Getting runner registration token..."
          TOKEN=$(python scripts/github_setup/get_runner_token.py)
          if [ -z "$TOKEN" ]; then
            echo "::error::Failed to get runner registration token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          umask 077
          printf '%s' "$TOKEN" > "$RUNNER_TEMP/runner_registration_token"
          unset TOKEN
          echo "Token obtained successfully"

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DO_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DO_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::DO_SSH_KEY secret not set"
            exit 1
          fi
          if [ -z "$SSH_KNOWN_HOSTS" ]; then
            echo "::error::DO_SSH_KNOWN_HOSTS secret not set"
            echo "Store the droplet's verified SSH host key line(s) in this secret."
            exit 1
          fi

          mkdir -p ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "%s\n" "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' 'Host *' '  StrictHostKeyChecking yes' '  UserKnownHostsFile ~/.ssh/known_hosts' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "SSH configured with strict host-key verification"

      - name: Test SSH Connection
        env:
          DROPLET_IP: ${{ steps.inputs.outputs.droplet_ip }}
          SSH_USER: ${{ steps.inputs.outputs.ssh_user }}
        run: |
          echo "Testing SSH connection to $DROPLET_IP..."
          if ! ssh "$SSH_USER@$DROPLET_IP" "echo 'SSH connection successful'; uname -a"; then
            echo "::error::SSH connection failed"
            exit 1
          fi

      - name: Copy Setup Script to Droplet
        env:
          DROPLET_IP: ${{ steps.inputs.outputs.droplet_ip }}
          SSH_USER: ${{ steps.inputs.outputs.ssh_user }}
        run: |
          echo "Copying setup script to droplet..."
          scp scripts/github_setup/setup_self_hosted_runner.sh \
            "$SSH_USER@$DROPLET_IP:/tmp/"
          echo "Script copied"

      - name: Verify Setup Script Integrity
        env:
          DROPLET_IP: ${{ steps.inputs.outputs.droplet_ip }}
          SSH_USER: ${{ steps.inputs.outputs.ssh_user }}
        run: |
          EXPECTED_SHA256="$(sha256sum scripts/github_setup/setup_self_hosted_runner.sh | awk '{print $1}')"
          echo "Verifying setup script integrity on droplet..."
          if ! ssh "$SSH_USER@$DROPLET_IP" \
            "printf '%s  %s\\n' \"$EXPECTED_SHA256\" /tmp/setup_self_hosted_runner.sh | sha256sum --check --status -"; then
            echo "::error::Setup script integrity verification failed"
            exit 1
          fi
          echo "Setup script integrity verified"

      - name: Run Setup Script on Droplet
        env:
          DROPLET_IP: ${{ steps.inputs.outputs.droplet_ip }}
          SSH_USER: ${{ steps.inputs.outputs.ssh_user }}
          REPO: ${{ github.repository }}
        run: |
          RUNNER_TOKEN="$(cat "$RUNNER_TEMP/runner_registration_token")"
          rm -f "$RUNNER_TEMP/runner_registration_token"
          echo "Running setup script on droplet..."
          if ! printf '%s\n%s\n' "$RUNNER_TOKEN" "$REPO" | ssh "$SSH_USER@$DROPLET_IP" \
            'read -r RUNNER_TOKEN && read -r REPO && export RUNNER_TOKEN REPO && bash /tmp/setup_self_hosted_runner.sh'; then
            unset RUNNER_TOKEN
            echo "::error::Runner setup failed"
            exit 1
          fi
          unset RUNNER_TOKEN
          echo "Runner setup complete"

      - name: Remove Remote Setup Script
        if: ${{ always() }}
        env:
          DROPLET_IP: ${{ steps.inputs.outputs.droplet_ip }}
          SSH_USER: ${{ steps.inputs.outputs.ssh_user }}
        run: |
          echo "Removing temporary setup script from droplet..."
          if ! ssh "$SSH_USER@$DROPLET_IP" 'rm -f /tmp/setup_self_hosted_runner.sh'; then
            echo "::warning::Could not remove temporary setup script"
          fi

      - name: Verify Runner Registration
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting 10 seconds for runner to register..."
          sleep 10
          echo "Checking runner status..."
          python scripts/github_setup/check_setup_status.py | jq '.runners'
          echo ""
          echo "Deployment complete!"
          echo "Check Settings > Actions > Runners to see the new runner"
