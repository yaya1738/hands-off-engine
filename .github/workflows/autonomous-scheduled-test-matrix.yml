name: Autonomous Scheduled Test Matrix

on:
  schedule:
    - cron: '57 */2 * * *'
  workflow_dispatch:

concurrency:
  group: autonomous-scheduled-test-matrix
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if test -f requirements.txt; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile
        run: python -m compileall -q ai tools
      - name: Full test suite
        run: pytest -q
