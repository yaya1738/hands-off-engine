name: Factory Ollama Local Agent Canary

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'hardening/**'
      - 'fix/**'
  pull_request:
    paths:
      - 'tools/factory_forensics/**'
      - '.github/workflows/factory-ollama-canary.yml'

permissions:
  contents: read

jobs:
  ollama-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull small coder model
        shell: bash
        run: ollama pull qwen2.5-coder:1.5b

      - name: Prove direct model execution is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from tools.factory_forensics.local_agent import prove_local_execution
          assert prove_local_execution('qwen2.5-coder:1.5b') is False
          PY

      - name: Prove bounded mutation is authority-gated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from tools.factory_forensics.local_agent import BoundedTask, execute_bounded_edit, run_ollama

          task = BoundedTask(
              allowed_path='tools/factory_forensics/ollama_canary_result.txt',
              allowed_contents=frozenset({'OLLAMA_CODE_EDIT_READY\n'}),
              write_content='OLLAMA_CODE_EDIT_READY\n',
          )
          for operation in (
              lambda: run_ollama('qwen2.5-coder:1.5b', task.prompt()),
              lambda: execute_bounded_edit('qwen2.5-coder:1.5b', task),
          ):
              try:
                  operation()
              except RuntimeError as exc:
                  assert '[FACTORY-AUTHORITY]' in str(exc)
              else:
                  raise AssertionError('direct authority bypass was not rejected')
          assert not Path(task.allowed_path).exists()
          PY

      - name: Verify canary made no repository mutation
        shell: bash
        run: |
          set -euo pipefail
          test ! -e tools/factory_forensics/ollama_canary_result.txt
          git diff --exit-code
