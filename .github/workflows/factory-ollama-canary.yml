name: Factory Ollama Local Agent Canary

on:
  push:
    branches:
      - factory-ollama-canary-20260812
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ollama-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull small coder model
        shell: bash
        run: ollama pull qwen2.5-coder:1.5b

      - name: Prove local model execution
        shell: bash
        run: |
          set -euo pipefail
          result="$(ollama run qwen2.5-coder:1.5b 'Reply with exactly: FACTORY_OLLAMA_READY')"
          printf '%s\n' "$result"
          test "$result" = "FACTORY_OLLAMA_READY"

      - name: Bounded agent execution bridge
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/task.txt <<'TASK'
          You are a bounded coding agent. Return ONLY one valid JSON object, with no markdown and no extra text, in exactly this schema:
          {"path":"tools/factory_forensics/ollama_canary_result.txt","content":"OLLAMA_CODE_EDIT_READY\n"}
          The requested change is to create that one file with exactly that content. You are not being asked to execute shell commands. Do not propose commands. Do not include any other file or field.
          TASK

          ollama run qwen2.5-coder:1.5b "$(cat /tmp/task.txt)" > /tmp/ollama_agent_output.txt
          cat /tmp/ollama_agent_output.txt

      - name: Apply model edit through bounded executor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          raw = Path('/tmp/ollama_agent_output.txt').read_text()
          raw = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)

          allowed_path = 'tools/factory_forensics/ollama_canary_result.txt'
          allowed_contents = {'OLLAMA_CODE_EDIT_READY', 'OLLAMA_CODE_EDIT_READY\n'}
          decoder = json.JSONDecoder()
          data = None
          errors = []

          # Models can repeat, truncate, or fence JSON. Scan every plausible
          # object start and accept only the exact bounded schema we authorize.
          for match in re.finditer(r'\{', raw):
              try:
                  candidate, _ = decoder.raw_decode(raw[match.start():])
              except json.JSONDecodeError as exc:
                  errors.append(str(exc))
                  continue
              if not isinstance(candidate, dict):
                  continue
              if set(candidate) != {'path', 'content'}:
                  continue
              if candidate.get('path') != allowed_path:
                  continue
              if candidate.get('content') not in allowed_contents:
                  continue
              data = candidate
              break

          if data is None:
              raise SystemExit(
                  'No authorized JSON edit found in agent response; '
                  f'scanned {len(errors)} invalid JSON candidates'
              )

          target = Path(data['path'])
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text('OLLAMA_CODE_EDIT_READY\n')
          PY

      - name: Verify bounded result
        shell: bash
        run: |
          set -euo pipefail
          test -f tools/factory_forensics/ollama_canary_result.txt
          test "$(cat tools/factory_forensics/ollama_canary_result.txt)" = "OLLAMA_CODE_EDIT_READY"
          git diff --exit-code -- ':!tools/factory_forensics/ollama_canary_result.txt' || {
            echo 'Unexpected files modified.'
            git status --short
            exit 1
          }
