name: Factory Ollama Local Agent Canary

on:
  push:
    branches:
      - fix/canary-validator-authority-20260830
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ollama-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null

      - name: Pull small coder model
        shell: bash
        run: ollama pull qwen2.5-coder:1.5b

      - name: Prove local model execution through shared agent module
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from tools.factory_forensics.local_agent import prove_local_execution
          if not prove_local_execution("qwen2.5-coder:1.5b"):
              raise SystemExit("Local Ollama execution proof failed")
          print("FACTORY_OLLAMA_READY")
          PY

      - name: Bounded agent execution bridge through shared agent module
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from tools.factory_forensics.local_agent import BoundedTask, execute_bounded_edit
          task = BoundedTask(
              allowed_path="tools/factory_forensics/ollama_canary_result.txt",
              allowed_contents=frozenset({"OLLAMA_CODE_EDIT_READY", "OLLAMA_CODE_EDIT_READY\n"}),
              write_content="OLLAMA_CODE_EDIT_READY\n",
          )
          result = execute_bounded_edit("qwen2.5-coder:1.5b", task)
          print(result)
          PY

      - name: Verify bounded result through shared validator
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          from tools.factory_forensics.validator import verify_result
          if not verify_result(
              "tools/factory_forensics/ollama_canary_result.txt",
              "OLLAMA_CODE_EDIT_READY\n",
          ):
              raise SystemExit("Bounded result verification failed")
          PY
          git diff --exit-code -- ':!tools/factory_forensics/ollama_canary_result.txt' || {
            echo 'Unexpected files modified.'
            git status --short
            exit 1
          }