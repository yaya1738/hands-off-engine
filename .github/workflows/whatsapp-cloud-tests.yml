name: WhatsApp Cloud Adapter Tests

on:
  pull_request:
    paths:
      - "messaging/**"
      - "tests/test_whatsapp_cloud.py"
      - ".github/workflows/whatsapp-cloud-tests.yml"
  push:
    branches: [main]
    paths:
      - "messaging/**"
      - "tests/test_whatsapp_cloud.py"
      - ".github/workflows/whatsapp-cloud-tests.yml"

permissions:
  contents: read

jobs:
  whatsapp-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run isolated adapter tests (no real API calls)
        run: python -m unittest discover -s tests -p 'test_whatsapp_cloud.py' -v
