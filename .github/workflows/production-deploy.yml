name: Governed Production Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact current-main commit SHA to deploy
        required: false
        type: string
      activate:
        description: Activate the production services after exact-SHA verification
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: autonomous-production-authority
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy through the available governed authority
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve requested revision under authority lock
        id: revision
        shell: bash
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git fetch --prune origin main
          main_sha="$(git rev-parse origin/main)"
          requested="${REQUESTED_REF:-$main_sha}"
          [[ "$requested" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'ref must be a 40-character commit SHA when supplied'; exit 1; }
          test "$requested" = "$main_sha" || { echo "Requested revision is not current main: requested=$requested main=$main_sha"; exit 1; }
          git checkout --detach "$requested"
          test "$(git rev-parse HEAD)" = "$requested"
          test "$(git status --porcelain)" = ''
          echo "sha=$requested" >> "$GITHUB_OUTPUT"

      - name: Fail closed on direct live order mutation
        run: python tools/factory_forensics/live_mutation_guard.py .

      - name: Determine available production authority
        id: authority
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -n "$DEPLOY_HOST" || -n "$DEPLOY_USER" || -n "$DEPLOY_KEY" || -n "$DEPLOY_KNOWN_HOSTS" ]]; then
            if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
              echo 'Remote production authority is partially configured; refusing unsafe fallback.' >&2
              exit 1
            fi
            echo 'mode=remote' >> "$GITHUB_OUTPUT"
            echo 'Remote production authority is fully configured with a pinned host key.'
          else
            echo 'mode=hosted' >> "$GITHUB_OUTPUT"
            echo 'Remote credentials are absent; using repository-native hosted production authority.'
          fi

      - name: Execute repository-native hosted production authority
        if: steps.authority.outputs.mode == 'hosted'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ steps.revision.outputs.sha }}'
          test "$(git status --porcelain)" = ''
          python tools/factory_forensics/deployment_preflight.py .
          python tools/autonomy_liveness_supervisor.py --once
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('state/autonomy_liveness.json').read_text(encoding='utf-8'))
          converged = state.get('converged') is True
          if converged:
              assert state.get('execution_observed') is False, state
              assert state.get('execution_succeeded') is False, state
              assert state.get('verification_observed') is True, state
              assert state.get('live_system_active') is True, state
              print('DEPLOY_OK authority=hosted converged=true sha=${{ steps.revision.outputs.sha }}')
          else:
              assert state.get('execution_observed') is True, state
              assert state.get('verification_observed') is True, state
              assert state.get('execution_succeeded') is True, state
              assert state.get('live_system_active') is True, state
              print('DEPLOY_OK authority=hosted converged=false sha=${{ steps.revision.outputs.sha }}')
          PY

      - name: Configure SSH for remote authority
        if: steps.authority.outputs.mode == 'remote'
        env:
          DEPLOY_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy and verify exact SHA on remote authority
        if: steps.authority.outputs.mode == 'remote'
        env:
          DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
          DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
          REQUESTED_SHA: ${{ steps.revision.outputs.sha }}
          ACTIVATE: ${{ inputs.activate }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$REQUESTED_SHA" "$ACTIVATE" <<'REMOTE'
          set -euo pipefail
          requested_sha="$1"
          activate="$2"
          cd /root/hands-off-engine
          git fetch --prune origin main
          test "$(git rev-parse origin/main)" = "$requested_sha"
          git checkout --detach "$requested_sha"
          test "$(git rev-parse HEAD)" = "$requested_sha"
          if [[ "$activate" == 'true' ]]; then
            for unit in hands-off-autonomous.service hands-off-autonomy-supervisor.service; do
              test -f "scripts/systemd/$unit"
              sudo install -m 0644 "scripts/systemd/$unit" "/etc/systemd/system/$unit"
            done
            sudo systemctl daemon-reload
            required_services=(hands-off-autonomous.service hands-off-telegram.service hands-off-autonomy-supervisor.service)
            for svc in "${required_services[@]}"; do
              systemctl cat "$svc" >/dev/null 2>&1 || { echo "Required production service missing: $svc" >&2; exit 1; }
              sudo systemctl enable "$svc"
            done
            test "$(systemctl show -p WorkingDirectory --value hands-off-autonomous.service)" = "/root/hands-off-engine"
            test "$(systemctl show -p WorkingDirectory --value hands-off-autonomy-supervisor.service)" = "/root/hands-off-engine"
            systemctl cat hands-off-autonomous.service | grep -F -- '/root/hands-off-engine' >/dev/null
            systemctl cat hands-off-autonomy-supervisor.service | grep -F -- '/root/hands-off-engine' >/dev/null
            for svc in "${required_services[@]}"; do
              if ! systemctl is-active --quiet "$svc"; then sudo systemctl restart "$svc"; fi
            done
          fi
          for svc in hands-off-autonomous.service hands-off-telegram.service; do
            systemctl is-active --quiet "$svc" || { echo "Required production service is not active: $svc" >&2; exit 1; }
          done
          if [[ "$activate" == 'true' ]]; then sudo systemctl is-active --quiet hands-off-autonomy-supervisor.service; fi
          test "$(git rev-parse HEAD)" = "$requested_sha"
          printf 'DEPLOY_OK authority=remote sha=%s activate=%s\n' "$requested_sha" "$activate"
          REMOTE
