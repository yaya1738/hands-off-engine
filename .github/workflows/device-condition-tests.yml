name: Focused Python Tests

on:
  pull_request:
    branches: ["main"]
    paths:
      - "scripts/device_condition.py"
      - "scripts/node1_runtime.py"
      - "tests/test_device_condition.py"
      - "tests/test_node1_device_condition_persistence.py"
      - ".github/workflows/device-condition-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-condition-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Run device-condition tests
        run: python -m pytest -q tests/test_device_condition.py tests/test_node1_device_condition_persistence.py
