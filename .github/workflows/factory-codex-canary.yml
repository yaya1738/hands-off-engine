name: Factory Codex Canary

on:
  pull_request:
    branches:
      - factory-mission-bootstrap-20260812
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-canary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Run Codex on bounded canary task
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are the bounded Factory autonomous-development canary.
            Modify ONLY tools/factory_canary.md.
            Change its single status line from CANARY_STATUS=BASELINE to CANARY_STATUS=AGENT_COMPLETED.
            Do not modify, create, or delete any other file.
            Do not run destructive commands.
            Do not access secrets.
            Do not push or commit; the workflow will persist your change.
            If the requested status is already present, make no changes.

      - name: Verify bounded change
        run: |
          set -euo pipefail
          test -f tools/factory_canary.md
          grep -qx 'CANARY_STATUS=AGENT_COMPLETED' tools/factory_canary.md
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain | awk '{print $2}')" = 'tools/factory_canary.md'

      - name: Persist agent change to PR branch
        run: |
          set -euo pipefail
          git config user.name 'factory-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/factory_canary.md
          git commit -m 'Factory canary: persist autonomous agent change'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report result
        run: |
          echo 'FACTORY_AUTONOMOUS_CANARY=PASS'
          echo 'Agent modified the bounded canary file and the workflow persisted the change to the PR branch.'
