name: Factory Codex Canary

on:
  pull_request:
    branches:
      - factory-mission-bootstrap-20260812
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  autonomous-canary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      HAS_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY != '' }}
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Run Codex on bounded canary task
        id: codex
        if: env.HAS_OPENAI_API_KEY == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are the bounded Factory autonomous-development canary.
            Modify ONLY tools/factory_canary.md.
            Change its single status line from CANARY_STATUS=BASELINE to CANARY_STATUS=AGENT_COMPLETED.
            Do not modify, create, or delete any other file.
            Do not run destructive commands.
            Do not access secrets.
            Do not push or commit; the workflow will persist your change.
            If the requested status is already present, make no changes.

      - name: Start local fallback agent
        if: env.HAS_OPENAI_API_KEY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          ollama pull qwen2.5-coder:1.5b

      - name: Prove local fallback execution
        if: env.HAS_OPENAI_API_KEY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          result="$(ollama run qwen2.5-coder:1.5b 'Reply with exactly: FACTORY_OLLAMA_READY')"
          test "$result" = "FACTORY_OLLAMA_READY"

      - name: Run bounded local fallback agent
        if: env.HAS_OPENAI_API_KEY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/task.txt <<'TASK'
          Return ONLY one valid JSON object with exactly these fields:
          {"path":"tools/factory_canary.md","operation":"set_status","value":"AGENT_COMPLETED"}
          The only permitted operation is setting the status line to CANARY_STATUS=AGENT_COMPLETED. Do not return file contents, commands, or any other file.
          TASK
          ollama run qwen2.5-coder:1.5b "$(cat /tmp/task.txt)" > /tmp/ollama_agent_output.txt

      - name: Apply bounded local agent result
        if: env.HAS_OPENAI_API_KEY != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path
          raw = Path('/tmp/ollama_agent_output.txt').read_text()
          raw = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', raw)
          start, end = raw.find('{'), raw.rfind('}')
          if start < 0 or end < start:
              raise SystemExit('Fallback agent returned no JSON object')
          data = json.loads(raw[start:end + 1])
          if set(data) != {'path', 'operation', 'value'}:
              raise SystemExit('Fallback agent schema violation')
          if data != {'path': 'tools/factory_canary.md', 'operation': 'set_status', 'value': 'AGENT_COMPLETED'}:
              raise SystemExit('Fallback agent operation violation')
          p = Path(data['path'])
          original = p.read_text()
          lines = original.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith('CANARY_STATUS=')]
          if len(matches) != 1 or lines[matches[0]] != 'CANARY_STATUS=BASELINE':
              raise SystemExit('Canary status precondition violation')
          lines[matches[0]] = 'CANARY_STATUS=AGENT_COMPLETED'
          p.write_text('\n'.join(lines) + '\n')
          PY

      - name: Verify bounded change
        run: |
          set -euo pipefail
          test -f tools/factory_canary.md
          grep -qx 'CANARY_STATUS=AGENT_COMPLETED' tools/factory_canary.md
          test "$(git status --porcelain | wc -l)" -eq 1
          test "$(git status --porcelain | awk '{print $2}')" = 'tools/factory_canary.md'

      - name: Persist agent change to PR branch
        run: |
          set -euo pipefail
          git config user.name 'factory-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/factory_canary.md
          git commit -m 'Factory canary: persist autonomous agent change'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Report result
        run: |
          echo "FACTORY_AUTONOMOUS_CANARY=PASS"
          if [ "$HAS_OPENAI_API_KEY" = 'true' ]; then
            echo 'execution_backend=codex'
          else
            echo 'execution_backend=local-ollama-fallback'
          fi
          echo 'Bounded agent operation was independently verified and persisted.'
