name: Autonomous Objective Cycle

on:
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
  workflow_dispatch:

# Shares the durable-state write lock with hosted production and authority
# workflows so autonomous state commits cannot race.
concurrency:
  group: autonomous-production-authority
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run objective, liveness, ingress, and UI-independence tests
        run: python -m pytest tests/test_autonomous_objective_loop.py tests/test_autonomy_liveness_supervisor.py tests/test_consumer_ui_independence.py tests/test_chatgpt_ui_outage_contract.py tests/test_github_issue_autonomous_ingress.py -q

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ingest authenticated GitHub autonomous requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.github_issue_autonomous_ingress

      - name: Run governed autonomous objective cycle
        run: python tools/autonomy_liveness_supervisor.py --once

      - name: Persist autonomous state for the next cycle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hands-off-autonomy[bot]"
          git config user.email "hands-off-autonomy[bot]@users.noreply.github.com"
          git add state/autonomy_liveness.json state/autonomous_task_queue.json state/autonomous_tasks_completed.jsonl state/autonomous_task_attempts.jsonl
          if git diff --cached --quiet; then
            echo 'No autonomous state changes to persist.'
          else
            git commit -m "chore: persist autonomous cycle state [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload machine-readable autonomy evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-objective-cycle
          path: state/autonomy_liveness.json
          if-no-files-found: error
