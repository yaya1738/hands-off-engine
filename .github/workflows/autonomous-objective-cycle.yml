name: Autonomous Objective Cycle

on:
  schedule:
    - cron: "*/30 * * * *"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run objective, liveness, and UI-independence tests
        run: python -m pytest tests/test_autonomous_objective_loop.py tests/test_autonomy_liveness_supervisor.py tests/test_consumer_ui_independence.py tests/test_chatgpt_ui_outage_contract.py -q

  discover:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run governed autonomous objective cycle
        run: python tools/autonomy_liveness_supervisor.py --once

      - name: Upload machine-readable autonomy evidence
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-objective-cycle
          path: state/autonomy_liveness.json
          if-no-files-found: error
