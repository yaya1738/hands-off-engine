name: Private Identity Regression Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "security/auto_identity.py"
      - "security/identity_gate.py"
      - "security/absolute_identity.py"
      - "tests/test_private_identity_fail_closed.py"
      - ".github/workflows/private-identity-tests.yml"
  push:
    branches:
      - "privacy/**"
    paths:
      - "security/auto_identity.py"
      - "security/identity_gate.py"
      - "security/absolute_identity.py"
      - "tests/test_private_identity_fail_closed.py"
      - ".github/workflows/private-identity-tests.yml"

permissions:
  contents: read

jobs:
  private-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Run private identity regression tests
        run: python -m pytest -q tests/test_private_identity_fail_closed.py
