name: Factory Authority Regression

on:
  pull_request:
    branches:
      - factory-capability-boundary-live-20260812
    paths:
      - 'ai/factory/**'
      - 'tests/test_autonomy_manager_authority.py'
      - 'tests/test_runtime_state_persistence.py'
      - '.github/workflows/factory-authority-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run authority and persistence regressions
        run: python -m pytest -q tests/test_autonomy_manager_authority.py tests/test_runtime_state_persistence.py
