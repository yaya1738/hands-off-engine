name: Factory Authority Regression

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ai/factory/**'
      - 'ai/approval_queue.py'
      - 'ai/autonomous_change.py'
      - 'ai/ai_runner.py'
      - 'scripts/autonomous_daemon.py'
      - 'scripts/snapshot_system_state.py'
      - 'scripts/task_dispatch.py'
      - 'tools/factory_script_doctor.py'
      - 'termux-hands-off/agent/orchestrator.py'
      - 'termux-hands-off/autopilot/control_server.py'
      - 'infrastructure/selfheal.py'
      - 'autonomous/self_healer.py'
      - 'autonomous/claude_optimizer.py'
      - 'autonomous/health_diagnostics.py'
      - 'autonomous/telegram_bot_creator.py'
      - 'autonomous/full_activation.py'
      - 'factory_milestone_gate.py'
      - 'factory_capability_constructor.py'
      - 'factory_autonomy_preflight.py'
      - 'factory_completion_flow_verifier.py'
      - 'factory_script_creator_bootstrap.py'
      - 'factory_introspection_controller.py'
      - 'tools/factory_commit.py'
      - 'tests/test_factory_script_creator_bootstrap_authority.py'
      - 'tests/test_factory_introspection_controller_authority.py'
      - 'tests/test_factory_commit_authority.py'
      - 'tests/test_factory_script_doctor_authority.py'
      - 'tests/test_snapshot_system_state_authority.py'
      - 'tests/test_task_dispatch_authority.py'
      - 'tests/test_termux_orchestrator_authority.py'
      - 'tests/test_authority_execution_bypass.py'
      - 'tests/test_autonomous_daemon_authority.py'
      - 'tests/test_autonomous_daemon_trading_gate.py'
      - 'tests/test_autonomous_daemon_subprocess_boundary.py'
      - 'tests/test_autonomy_manager_authority.py'
      - 'tests/test_event_replay_persistence.py'
      - 'tests/test_runtime_state_persistence.py'
      - 'tests/test_execution_journal.py'
      - 'tests/test_execution_reconciler.py'
      - 'tests/test_authority_startup_reconciliation.py'
      - 'tests/test_self_repair_pipeline_subprocess_boundary.py'
      - 'tests/test_ai_runner_authority.py'
      - 'tests/test_legacy_approval_execution_boundary.py'
      - 'tests/test_autonomous_change_authority.py'
      - 'tests/test_legacy_control_server_authority.py'
      - 'tests/test_selfheal_authority_boundary.py'
      - 'tests/test_self_healer_authority_boundary.py'
      - 'tests/test_claude_optimizer_authority.py'
      - 'tests/test_health_diagnostics_authority.py'
      - 'tests/test_telegram_bot_creator_authority.py'
      - 'tests/test_full_activation_authority.py'
      - 'tests/test_factory_milestone_gate_authority.py'
      - 'tests/test_factory_capability_constructor_authority.py'
      - 'tests/test_factory_autonomy_preflight_authority.py'
      - 'tests/test_factory_completion_flow_verifier_authority.py'
      - 'factory_self_repair_pipeline.py'
      - '.github/workflows/factory-authority-regression.yml'
      - '.github/workflows/auto-merge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Run authority regressions
        run: python -m pytest -q tests/test_authority_execution_bypass.py tests/test_autonomous_daemon_authority.py tests/test_autonomous_daemon_trading_gate.py tests/test_autonomous_daemon_subprocess_boundary.py tests/test_autonomy_manager_authority.py tests/test_event_replay_persistence.py tests/test_runtime_state_persistence.py tests/test_execution_journal.py tests/test_execution_reconciler.py tests/test_authority_startup_reconciliation.py tests/test_self_repair_pipeline_subprocess_boundary.py tests/test_ai_runner_authority.py tests/test_legacy_approval_execution_boundary.py tests/test_autonomous_change_authority.py tests/test_legacy_control_server_authority.py tests/test_selfheal_authority_boundary.py tests/test_self_healer_authority_boundary.py tests/test_claude_optimizer_authority.py tests/test_health_diagnostics_authority.py tests/test_telegram_bot_creator_authority.py tests/test_full_activation_authority.py tests/test_factory_milestone_gate_authority.py tests/test_factory_capability_constructor_authority.py tests/test_factory_autonomy_preflight_authority.py tests/test_factory_completion_flow_verifier_authority.py tests/test_factory_script_creator_bootstrap_authority.py tests/test_factory_introspection_controller_authority.py tests/test_factory_commit_authority.py tests/test_factory_script_doctor_authority.py tests/test_snapshot_system_state_authority.py tests/test_task_dispatch_authority.py tests/test_termux_orchestrator_authority.py
