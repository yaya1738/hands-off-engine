name: Factory Autonomous Development

# The hosted Factory continuously turns verified autonomous objectives into
# bounded coding-agent PRs. It never writes directly to main.

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'state/**'

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: read

concurrency:
  group: autonomous-development-authority
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve exact current main under development lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          current_sha=$(git rev-parse origin/main)
          git checkout --detach "$current_sha"
          test "$(git rev-parse HEAD)" = "$current_sha"
          test "$(git status --porcelain)" = ""
          echo "BASE_SHA=$current_sha" >> "$GITHUB_ENV"

      - name: Skip when another autonomous development PR is open
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --search 'head:autonomous-factory/' --json number --jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "An autonomous Factory development PR is already open; preserving one-change-at-a-time progression."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install repository test dependencies
        if: steps.existing.outputs.skip != 'true'
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run repository deployment preflight
        if: steps.existing.outputs.skip != 'true'
        run: python tools/factory_forensics/deployment_preflight.py .

      - name: Read autonomous objective
        id: objective
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('state/autonomy_liveness.json')
          if not p.exists():
              raise SystemExit('AUTONOMOUS_OBJECTIVE_UNAVAILABLE')
          state = json.loads(p.read_text(encoding='utf-8'))
          if state.get('converged') is True:
              print('AUTONOMOUS_FACTORY_CONVERGED')
              print('No autonomous coding objective remains; preserving the verified steady state.')
              print('converged=true')
              raise SystemExit(0)
          print('converged=false')
          if state.get('execution_succeeded') is not True or state.get('live_system_active') is not True:
              raise SystemExit('AUTONOMOUS_SYSTEM_NOT_VERIFIED')
          selected = state.get('selection', {}).get('selected', {})
          objective = selected.get('objective')
          if not objective:
              raise SystemExit('AUTONOMOUS_OBJECTIVE_UNAVAILABLE')
          print(objective)
          Path('/tmp/factory_objective.txt').write_text(objective, encoding='utf-8')
          PY

      - name: Run bounded autonomous coding agent
        if: steps.existing.outputs.skip != 'true' && steps.objective.outputs.converged != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            You are the repository's bounded autonomous Factory development agent.
            Read /tmp/factory_objective.txt and inspect the actual repository.
            Make ONE concrete, reviewable improvement advancing that objective.
            Preserve every safety, authority, audit, cost, risk, verification,
            credential, and financial-live-execution control.
            Only modify ai/**, tools/**, scripts/**, or tests/**.
            Never modify state, credentials, financial/trading code, or workflows.
            Do not access or print secrets. Prefer a small coherent change.
            Run focused tests and fix failures introduced. Do not commit, push,
            create PRs, or use destructive git commands. If already satisfied,
            make no change.

      - name: Enforce bounded change surface
        if: steps.existing.outputs.skip != 'true' && steps.objective.outputs.converged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "$BASE_SHA" --)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'FACTORY_AUTONOMOUS_DEVELOPMENT=NOOP'
            exit 0
          fi
          if [ "${#changed[@]}" -gt 8 ]; then
            echo "DENY: autonomous agent changed ${#changed[@]} files; maximum is 8."
            printf '%s\n' "${changed[@]}"
            exit 1
          fi
          for path in "${changed[@]}"; do
            case "$path" in
              ai/*|tools/*|scripts/*|tests/*) ;;
              *) echo "DENY: autonomous development path: $path"; exit 1 ;;
            esac
          done
          printf '%s\n' "${changed[@]}" | tee /tmp/factory_changed_files.txt

      - name: Validate autonomous change
        if: steps.existing.outputs.skip != 'true' && steps.objective.outputs.converged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/factory_changed_files.txt ]; then exit 0; fi
          python -m compileall -q ai tools scripts
          python -m pytest -q

      - name: Revalidate base and objective before PR
        if: steps.existing.outputs.skip != 'true' && steps.objective.outputs.converged != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --prune
          latest=$(git rev-parse origin/main)
          test "$latest" = "$BASE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('state/autonomy_liveness.json').read_text(encoding='utf-8'))
          if state.get('converged') is True:
              raise SystemExit('AUTONOMOUS_OBJECTIVE_CONVERGED')
          if state.get('execution_succeeded') is not True or state.get('live_system_active') is not True:
              raise SystemExit('AUTONOMOUS_SYSTEM_NOT_VERIFIED')
          PY

      - name: Create autonomous development PR and enable auto-merge
        if: steps.existing.outputs.skip != 'true' && steps.objective.outputs.converged != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/factory_changed_files.txt ]; then exit 0; fi
          cycle=$(python - <<'PY'
          import json
          from pathlib import Path
          try: print(json.loads(Path('state/autonomy_liveness.json').read_text())['mission']['cycle_count'])
          except Exception: print('unknown')
          PY
          )
          branch="autonomous-factory/cycle-${cycle}-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git config user.name 'factory-autonomous-agent'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- $(cat /tmp/factory_changed_files.txt)
          git commit -m "Factory autonomous improvement: cycle ${cycle}"
          git push --set-upstream origin "$branch"
          objective=$(cat /tmp/factory_objective.txt)
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "Factory autonomous improvement: cycle ${cycle}" --body "## Autonomous Factory development\n\nObjective:\n${objective}\n\nBounded to ai/tools/scripts/tests; preflight and full tests passed.")
          number=$(grep -oE '[0-9]+$' <<<"$pr")
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --auto
          gh workflow run auto-merge.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$number"
          echo "AUTONOMOUS_PR=$number"
