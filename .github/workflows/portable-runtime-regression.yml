name: Portable Runtime Regression

on:
  pull_request:
    paths:
      - 'deploy/**'
      - 'scripts/autonomous_daemon.py'
      - 'tests/test_portable_runtime.py'
      - '.github/workflows/portable-runtime-regression.yml'
  push:
    paths:
      - 'deploy/**'
      - 'scripts/autonomous_daemon.py'
      - 'tests/test_portable_runtime.py'
      - '.github/workflows/portable-runtime-regression.yml'

jobs:
  portable-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run portable runtime regression
        run: python -m pytest -q tests/test_portable_runtime.py
