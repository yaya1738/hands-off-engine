name: Autonomous Harmony Engine

# Runs the autonomous harmony system on a schedule
# Money grows itself, software improves itself, hardware manages itself
# All for Yair Siegel's benefit

on:
  schedule:
    # Run every hour to check system harmony
    - cron: '0 * * * *'
  push:
    branches:
      - main
    paths:
      - 'scripts/harmony_orchestrator.py'
      - 'alpha/alpha_self_learning.py'
      - 'scripts/self_improvement_engine.py'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Which component to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - harmony
          - alpha
          - software

permissions:
  contents: write
  issues: write

jobs:
  harmony-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Harmony Orchestrator
        id: harmony
        run: |
          echo "🎯 Running Harmony Orchestrator..."
          python scripts/harmony_orchestrator.py --once 2>&1 | tee harmony_output.txt
          echo "harmony_result<<EOF" >> $GITHUB_OUTPUT
          cat harmony_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Alpha Self-Learning
        if: always()
        id: alpha
        run: |
          echo "💰 Running Alpha Self-Learning..."
          python alpha/alpha_self_learning.py 2>&1 | tee alpha_output.txt || true
          echo "alpha_result<<EOF" >> $GITHUB_OUTPUT
          cat alpha_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run Software Self-Improvement
        if: always()
        id: software
        run: |
          echo "🔧 Running Software Self-Improvement..."
          python scripts/self_improvement_engine.py 2>&1 | tee software_output.txt || true
          echo "software_result<<EOF" >> $GITHUB_OUTPUT
          cat software_output.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Commit state updates
        if: always()
        run: |
          git config user.name "Autonomous Harmony Engine"
          git config user.email "harmony@hands-off-engine.local"
          
          # Add any state file changes
          git add state/*.json logs/*.jsonl 2>/dev/null || true
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "🎯 Autonomous harmony cycle $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi

      - name: Create harmony status summary
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const harmony = `${{ steps.harmony.outputs.harmony_result }}`.slice(0, 500);
            const alpha = `${{ steps.alpha.outputs.alpha_result }}`.slice(0, 300);
            const software = `${{ steps.software.outputs.software_result }}`.slice(0, 300);
            
            // Extract harmony score from output
            const harmonyMatch = harmony.match(/Harmony score: ([\d.]+%)/);
            const harmonyScore = harmonyMatch ? harmonyMatch[1] : 'unknown';
            
            console.log(`🎯 Harmony Score: ${harmonyScore}`);
            console.log(`💰 Alpha: ${alpha.includes('insights') ? 'Learning active' : 'No new insights'}`);
            console.log(`🔧 Software: ${software.includes('opportunities') ? 'Scanning' : 'Clean'}`);
            
            // Only notify on degraded status
            if (harmony.includes('degraded') || harmony.includes('critical')) {
              const issues = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: 'harmony-status',
                state: 'open'
              });
              
              const statusBody = `## ⚠️ Harmony Status Alert
              
**Time:** ${new Date().toISOString()}
**Score:** ${harmonyScore}

### Harmony Check
\`\`\`
${harmony}
\`\`\`

### Alpha Learning
\`\`\`
${alpha}
\`\`\`

### Software Improvement
\`\`\`
${software}
\`\`\`

---
*Automated by Autonomous Harmony Engine*`;
              
              if (issues.data.length > 0) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues.data[0].number,
                  body: statusBody
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: '⚠️ Harmony Status - Attention Needed',
                  labels: ['harmony-status'],
                  body: statusBody
                });
              }
            }
