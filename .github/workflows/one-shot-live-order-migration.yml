name: One-shot live-order migration

on:
  push:
    branches:
      - hardening/live-order-migration-20260907

permissions:
  contents: write

jobs:
  migrate:
    if: github.ref == 'refs/heads/hardening/live-order-migration-20260907'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: hardening/live-order-migration-20260907

      - name: Route legacy order mutations through fail-closed authority
        shell: python
        run: |
          from pathlib import Path

          files = [
              Path("MONEY_PRINTER.py"),
              Path("autonomous/espn_executor.py"),
              Path("executor/polymarket_lightning.py"),
              Path("integrafix/money_printer.py"),
              Path("integrafix/abcfc_live_nexus.py"),
              Path("integrafix/trading_pipeline.py"),
              Path("integrafix/autonomous_abcfc_executor.py"),
          ]
          changed = []
          for path in files:
              text = path.read_text(encoding="utf-8")
              if "post_order(" not in text:
                  continue
              text = text.replace("post_order(", "submit_legacy_order(")
              if "from ai.factory.live_order_authority import submit_legacy_order" not in text:
                  text = "from ai.factory.live_order_authority import submit_legacy_order\n" + text
              path.write_text(text, encoding="utf-8")
              changed.append(str(path))

          if len(changed) != 7:
              raise SystemExit(f"Expected exactly 7 migrated production files, got {len(changed)}: {changed}")
          print("Migrated:")
          print("\n".join(changed))

      - name: Verify no direct live-order mutation remains
        shell: bash
        run: |
          set -euo pipefail
          python tools/factory_forensics/live_mutation_guard.py .
          python -m compileall -q ai autonomous executor integrafix MONEY_PRINTER.py
          python - <<'PY'
          from ai.factory.live_order_authority import LiveOrderAuthority, OrderIntent

          denied = LiveOrderAuthority().submit(
              OrderIntent(token_id="token", price=0.5, size=1, side="BUY", source="smoke")
          )
          assert denied["executed"] is False
          assert denied["reason"] == "live_order_authority_disabled"

          invalid = LiveOrderAuthority().authorize(
              OrderIntent(token_id="", price=0.5, size=1, side="BUY")
          )
          assert invalid["reason"] == "missing_token_id"

          still_closed = LiveOrderAuthority(enabled=True).submit(
              OrderIntent(token_id="token", price=0.5, size=1, side="BUY")
          )
          assert still_closed["executed"] is False
          assert still_closed["reason"] == "activation_contract_not_implemented"
          print("LIVE_ORDER_AUTHORITY_SMOKE_OK")
          PY

      - name: Commit migration and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-live-order-migration.yml
          git add MONEY_PRINTER.py autonomous/espn_executor.py executor/polymarket_lightning.py integrafix/money_printer.py integrafix/abcfc_live_nexus.py integrafix/trading_pipeline.py integrafix/autonomous_abcfc_executor.py
          git diff --cached --check
          git commit -m "Security: route all legacy live-order calls through authority"
          git push origin HEAD:hardening/live-order-migration-20260907
