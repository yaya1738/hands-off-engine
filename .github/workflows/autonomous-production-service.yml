name: Autonomous Hosted Production Service

on:
  push:
    paths-ignore:
      - "state/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: write
  issues: write

env:
  PYTHONUNBUFFERED: "1"

# A stale hosted runner must never block the next governed service cycle.
# A newer cycle cancels the stale cycle before taking the same authority lock.
concurrency:
  group: autonomous-production-authority
  cancel-in-progress: true

jobs:
  autonomous-service:
    if: github.event_name != 'issues' || (github.event.issue.pull_request == null && startsWith(github.event.issue.title, '[autonomous]'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main revision
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve current main under authority lock
        shell: bash
        run: |
          set -euo pipefail
          git fetch --prune origin main
          current_sha="$(git rev-parse origin/main)"
          git checkout --detach "$current_sha"
          test "$(git rev-parse HEAD)" = "$current_sha"
          test "$(git status --porcelain)" = ""
          echo "authority_revision=$current_sha"

      - name: Install runtime dependencies
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --disable-pip-version-check -r requirements.txt
          else
            echo "No requirements.txt present; repository runtime uses only the standard library for this hosted cycle."
          fi

      - name: Ingest authenticated autonomous GitHub requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m tools.github_issue_autonomous_ingress

      - name: Execute phase-aware autonomous service cycle
        run: python tools/autonomous_phase_supervisor.py

      - name: Assert governed execution or verified convergence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          phase = json.loads(Path("state/dass_phase.json").read_text(encoding="utf-8"))
          selected = phase.get("phase")
          assert selected in {"pre_dass", "post_dass"}, phase

          converged = state.get("converged") is True
          if converged:
              assert state.get("live_system_active") is True, state
              assert state.get("execution_succeeded") is False, state
              print(f"Governed autonomous convergence verified; heartbeat remains active in {selected}.")
          else:
              assert state.get("execution_observed") is True, state
              assert state.get("verification_observed") is True, state
              assert state.get("execution_succeeded") is True, state
              assert state.get("live_system_active") is True, state
              print(f"Governed autonomous execution success verified in {selected}.")
          PY

      - name: Persist service evidence
        run: |
          set -euo pipefail
          converged=$(python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          print("true" if state.get("converged") is True else "false")
          PY
          )
          transition=$(python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path("state/autonomy_liveness.json").read_text(encoding="utf-8"))
          mission=state.get("mission", {})
          print("true" if mission.get("convergence_transition") is True else "false")
          PY
          )
          if [ "$converged" = "true" ] && [ "$transition" != "true" ]; then
            echo "Verified converged steady state; no durable heartbeat commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in \
            state/autonomy_liveness.json \
            state/autonomy_mission.json \
            state/dass_phase.json \
            state/autonomous_task_queue.json \
            state/autonomous_tasks_completed.jsonl \
            state/autonomous_task_attempts.jsonl \
            state/autonomous_tasks.jsonl; do
            if [ -e "$f" ]; then git add -f "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist phase-aware autonomous service state"
            for attempt in 1 2 3; do
              git fetch --prune origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Persisted phase-aware autonomous state on current main (attempt $attempt)."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo 'Failed to persist phase-aware autonomous state after 3 synchronized push attempts.' >&2
                exit 1
              fi
              sleep $((attempt * 2))
            done
          fi

      - name: Publish execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-production-evidence-${{ github.run_id }}
          path: |
            state/autonomy_liveness.json
            state/autonomy_mission.json
            state/dass_phase.json
            state/autonomous_task_queue.json
            state/autonomous_tasks_completed.jsonl
            state/autonomous_task_attempts.jsonl
            state/autonomous_tasks.jsonl
          if-no-files-found: ignore
          retention-days: 14
