name: AI Intake

# GitHub Copilot Agent workflow
# Part of AI Agent Link Protocol v0.1 (see docs/AI_AGENT_LINK_PROTOCOL_v0.1.md)
# This workflow enables GitHub Copilot Agent to respond to issue commands
# Primary flow: ChatGPT → SYSTEM HANDOFF → Claude CLI
# Secondary flow: ChatGPT → SYSTEM HANDOFF → GitHub Copilot Agent (via issue paste)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  handle-intake:
    runs-on: ubuntu-latest

    env:
      AI_INTAKE_ISSUE_NUMBER: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai requests

      - name: Run AI Intake handler
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          AI_INTAKE_ISSUE_NUMBER: "1"
        run: |
          python ai/ai_intake_handler.py